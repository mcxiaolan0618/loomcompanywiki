<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        .identity-detail {
            max-width: 800px;
            margin: 0 auto;
            padding: 24px 16px;
        }
        .identity-detail .back-link {
            display: inline-block;
            color: var(--gold);
            text-decoration: none;
            font-size: 0.85rem;
            margin-bottom: 16px;
            padding: 4px 12px;
            border: 1px solid var(--gold-dim);
            border-radius: 4px;
        }
        .identity-detail .back-link:hover { background: rgba(201,166,92,0.1); }

        .detail-title {
            text-align: center;
            color: var(--gold);
            font-size: 1.8rem;
            letter-spacing: 3px;
            margin-bottom: 24px;
        }

        .info-card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .info-card h3 {
            color: var(--gold);
            font-size: 1rem;
            letter-spacing: 2px;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        .info-card h4 {
            color: var(--gold-dim);
            font-size: 0.9rem;
            letter-spacing: 1px;
            margin: 12px 0 8px;
        }

        .info-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 10px;
            font-size: 0.85rem;
        }
        .info-item { color: var(--text-dim); }
        .info-item strong { color: var(--text); }

        .ego-resources {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 6px;
        }
        .ego-resources img { width: 28px; height: 28px; }
        .ego-resource-item {
            display: flex;
            align-items: center;
            gap: 3px;
            color: var(--text-dim);
            font-size: 0.85rem;
        }

        .resist-display {
            display: flex;
            gap: 14px;
            align-items: center;
        }
        .resist-display .resist-item {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--text-dim);
            font-size: 0.85rem;
        }
        .resist-display img { width: 24px; height: 24px; }

        .level-input-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }
        .level-input-row input {
            width: 80px;
            padding: 6px 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            font-size: 0.9rem;
            font-family: inherit;
            text-align: center;
        }
        .level-input-row input:focus { border-color: var(--gold); outline: none; }
        .level-input-row .label { color: var(--text-dim); font-size: 0.85rem; }

        .stat-row {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }
        .stat-row .stat-label { color: var(--text-dim); min-width: 70px; }
        .stat-row .stat-value { color: var(--text); font-weight: bold; }
        .stat-row .stat-base { color: var(--text-dim); font-size: 0.78rem; }

        .speed-row { display: flex; gap: 12px; flex-wrap: wrap; }
        .speed-item { color: var(--text-dim); font-size: 0.82rem; }
        .speed-item span { color: var(--text); }

        .story-link { color: var(--gold); text-decoration: none; font-size: 0.85rem; }
        .story-link:hover { text-decoration: underline; }

        .sanity-section { margin-top: 14px; }
        .sanity-box { padding: 12px; border-radius: 6px; margin-bottom: 8px; font-size: 0.85rem; }
        .sanity-box.positive { border: 1px solid #3a6ab5; background: rgba(58,106,181,0.08); }
        .sanity-box.positive .sanity-title { color: #5a9af5; font-weight: bold; margin-bottom: 6px; }
        .sanity-box.negative { border: 1px solid #8b3a3a; background: rgba(139,58,58,0.08); }
        .sanity-box.negative .sanity-title { color: #d04a4a; font-weight: bold; margin-bottom: 6px; }
        .sanity-box ul { list-style: none; padding: 0; margin: 0; }
        .sanity-box li { color: var(--text-dim); padding: 2px 0; }
        .sanity-box li::before { content: '• '; }

        /* ========== 技能卡片 ========== */
        .skill-card { border-radius: 8px; padding: 14px; margin-bottom: 12px; }
        .skill-card .skill-header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
        .skill-card .skill-tag {
            font-size: 0.65rem; padding: 2px 6px; border-radius: 3px;
            background: var(--surface); color: var(--text-dim); letter-spacing: 1px;
            margin-right: 2px;
        }
        .skill-card .skill-name { font-weight: bold; font-size: 0.9rem; letter-spacing: 1px; }
        .skill-card .skill-icons { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .skill-card .skill-icons img { width: 22px; height: 22px; }
        .skill-card .stage-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
        .skill-card .stage-tab {
            padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border);
            background: var(--surface); color: var(--text-dim); cursor: pointer;
            font-size: 0.72rem; font-family: inherit; transition: all 0.2s;
        }
        .skill-card .stage-tab:hover { border-color: var(--gold); color: var(--gold); }
        .skill-card .stage-tab.active {
            border-color: var(--sin-border); background: var(--sin-bg);
            color: var(--sin-color); font-weight: bold;
        }
        .skill-card .skill-desc-row { display: flex; align-items: flex-start; gap: 8px; }
        .skill-card .skill-desc-row img { width: 28px; height: 28px; flex-shrink: 0; margin-top: 2px; }
        .skill-card .skill-desc-text { color: var(--text-dim); font-size: 0.8rem; line-height: 1.6; white-space: pre-line; }

        .sin-text { font-weight: bold; }
        .sin-text.sin-wrath { color: #d0423a; }
        .sin-text.sin-lust { color: #e8883a; }
        .sin-text.sin-sloth { color: #c9a62c; }
        .sin-text.sin-gluttony { color: #5a9a3a; }
        .sin-text.sin-gloom { color: #3a8aaa; }
        .sin-text.sin-pride { color: #3a5ab5; }
        .sin-text.sin-envy { color: #7a3a9a; }

        .skill-card.defense-card .stage-tab.active {
            border-color: #8a7e6b; background: rgba(138,126,107,0.12);
            color: #b0a590; font-weight: bold;
        }

        /* ========== 被动 ========== */
        .passive-block { margin-bottom: 14px; }
        .passive-name { color: var(--text); font-weight: bold; font-size: 0.9rem; }
        .passive-info { color: var(--text-dim); font-size: 0.8rem; margin-bottom: 4px; }
        .passive-info img { width: 18px; height: 18px; vertical-align: middle; }
        .passive-effect { color: var(--text-dim); font-size: 0.8rem; line-height: 1.5; }
        .passive-stage-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0; }
        .passive-stage-tab {
            padding: 3px 8px; border-radius: 3px; border: 1px solid var(--border);
            background: var(--surface); color: var(--text-dim); cursor: pointer;
            font-size: 0.7rem; font-family: inherit; transition: all 0.2s;
        }
        .passive-stage-tab:hover { border-color: var(--gold); color: var(--gold); }
        .passive-stage-tab.active {
            border-color: var(--gold-dim); background: rgba(201,166,92,0.1);
            color: var(--gold); font-weight: bold;
        }

        /* ========== 语音台词 ========== */
        .voice-list { list-style: none; padding: 0; margin: 0; }
        .voice-list li { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 0.82rem; }
        .voice-list li .voice-label { color: var(--gold-dim); font-weight: bold; margin-right: 6px; white-space: nowrap; }
        .voice-list li .voice-text { color: var(--text-dim); }
    </style>
</head>

        function renderSkills() {
            const container = document.getElementById('skillsContainer');
            let html = '';

            const s = myData;
            const defaultSkillImg = {
                '一技能': '技能-' + s.skillTop.physics + '-' + s.skillTop.sin + '.png',
                '二技能': '技能-' + s.skillMiddle.physics + '-' + s.skillMiddle.sin + '.png',
                '三技能': '技能-' + s.skillBottom.physics + '-' + s.skillBottom.sin + '.png'
            };
            const defaultSin = {
                '一技能': s.skillTop.sin,
                '二技能': s.skillMiddle.sin,
                '三技能': s.skillBottom.sin
            };

            SKILLS.forEach((skill, idx) => {
                const skillSin = skill.sin || defaultSin[skill.tag] || '暴怒';
                const sinEn = SIN_MAP[skillSin] || 'wrath';
                const skillImg = skill.skillImg || defaultSkillImg[skill.tag] || '';
                const defaultStage = skill.stages[skill.stages.length - 1];
                html += `
                <div class="info-card skill-card sin-${sinEn}">
                    <div class="skill-header">
                        <span class="skill-tag">${skill.tag}</span>
                        <span class="skill-name sin-text sin-${sinEn}">${skill.name}</span>
                        <span class="sin-text sin-${sinEn}">×${skill.count}</span>
                        <span class="skill-icons"><img src="/loomcompanywiki/img/硬币.png"> ×${skill.coin}</span>
                        <span class="skill-icons"><img src="/loomcompanywiki/img/数值图标-攻击.png"> ${skill.attack}</span>
                        <span class="skill-icons"><img src="/loomcompanywiki/img/数值图标-攻击容量.png"> ×${skill.capacity}</span>
                    </div>
                    <div class="stage-tabs">

                        <img src="/loomcompanywiki/img/${skillImg}" onerror="this.style.display='none'">
                        <span class="skill-desc-text">${skill.desc[defaultStage] || ''}</span>
                    </div>
                </div>`;
            });

            DEFENSE_SKILLS.forEach((skill, idx) => {
                const defaultStage = skill.stages[skill.stages.length - 1];
                let tabsHTML = '';
                skill.stages.forEach(st => {
                    let label = st + '阶';
                    if (st === 'IV' && skill.extraSin) {
                        label += ' 追加属性：<img src="/loomcompanywiki/img/罪孽-' + skill.extraSin + '.png" style="width:18px;height:18px;vertical-align:middle;">';
                    }
                    tabsHTML += '<button class="stage-tab' + (st === defaultStage ? ' active' : '') + '" onclick="switchDefStage(' + idx + ',\'' + st + '\')">' + label + '</button>';
                });
                html += `
                <div class="info-card skill-card defense-card">
                    <div class="skill-header">
                        <span class="skill-name" style="color:#b0a590;">${skill.name}</span>
                        <span class="skill-icons"><img src="/loomcompanywiki/img/硬币.png"> ×${skill.coin}</span>
                        <span class="skill-icons"><img src="/loomcompanywiki/img/数值图标-守备.png"> +${skill.defense}</span>
                        <span class="skill-icons"><img src="/loomcompanywiki/img/数值图标-攻击容量.png"> ×${skill.capacity}</span>
                    </div>
                    <div class="stage-tabs">${tabsHTML}</div>
                    <div class="skill-desc-row" id="def-desc-${idx}">
                        <span class="skill-desc-text">${skill.desc[defaultStage] || ''}</span>
                    </div>
                </div>`;
            });

            container.innerHTML = html;
        }

        function renderPassives() {
            const combatEl = document.getElementById('combatPassive');
            const supportEl = document.getElementById('supportPassive');

            let combatHTML = '';
            COMBAT_PASSIVES.forEach((passive, i) => {
                const defaultStage = passive.stages[passive.stages.length - 1];
                let tabsHTML = '';
                passive.stages.forEach(st => {
                    tabsHTML += '<button class="passive-stage-tab' + (st === defaultStage ? ' active' : '') + '" onclick="switchCombatPassiveStage(this,\'' + st + '\',' + i + ')">' + st + '</button>';
                });

                let infoLine = '';
                if (!passive.noCost && myData.combatPassive) {
                    infoLine = ' —— ' + myData.combatPassive.way + '：<img src="/loomcompanywiki/img/' + myData.combatPassive.sin + '.png">×' + myData.combatPassive.need;
                }

                combatHTML += `
                <div class="passive-block" id="combat-passive-${i}">
                    <div class="passive-name">${passive.name}${infoLine}</div>
                    <div class="passive-stage-tabs">${tabsHTML}</div>
                    <div class="passive-effect" id="combat-passive-effect-${i}">${passive.effects[defaultStage] || ''}</div>
                </div>`;
            });
            combatEl.innerHTML = combatHTML;

            const sp = SUPPORT_PASSIVE;
            const spData = myData.supportPassive;
            const spDefaultStage = sp.stages[sp.stages.length - 1];
            let spTabsHTML = '';
            sp.stages.forEach(st => {
                spTabsHTML += '<button class="passive-stage-tab' + (st === spDefaultStage ? ' active' : '') + '" onclick="switchSupportPassiveStage(this,\'' + st + '\')">' + st + '</button>';
            });
            supportEl.innerHTML = `
            <div class="passive-block" id="support-passive">
                <div class="passive-name">${sp.name} —— ${spData.way}：<img src="/loomcompanywiki/img/${spData.sin}.png">×${spData.need}</div>
                <div class="passive-stage-tabs">${spTabsHTML}</div>
                <div class="passive-effect" id="support-passive-effect">${sp.effects[spDefaultStage] || ''}</div>
            </div>`;

            window.combatPassivesData = COMBAT_PASSIVES;
            window.supportPassiveData = SUPPORT_PASSIVE;
        }

        window.switchCombatPassiveStage = function(btn, stage, idx) {
            const data = window.combatPassivesData[idx];
            const parent = btn.parentElement.parentElement;
            parent.querySelector('.passive-effect').textContent = data.effects[stage] || '';
            parent.querySelectorAll('.passive-stage-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
        };

        window.switchSupportPassiveStage = function(btn, stage) {
            const data = window.supportPassiveData;
            const parent = btn.parentElement.parentElement;
            parent.querySelector('.passive-effect').textContent = data.effects[stage] || '';
            parent.querySelectorAll('.passive-stage-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
        };

        function renderVoices() {
            document.getElementById('voiceList').innerHTML = VOICE_LINES.map(v => '<li><span class="voice-label">' + v.label + '：</span><span class="voice-text">' + v.text + '</span></li>').join('');
        }

        function switchStage(type, idx, stage) {
            const skill = SKILLS[idx];
            const descEl = document.getElementById('skill-desc-' + idx).querySelector('.skill-desc-text');
            descEl.textContent = skill.desc[stage] || '';
            const tabs = document.getElementById('skill-desc-' + idx).parentElement.querySelectorAll('.stage-tab');
            tabs.forEach(t => t.classList.remove('active'));
            const activeTab = Array.from(tabs).find(t => t.textContent.trim().startsWith(stage));
            if (activeTab) activeTab.classList.add('active');
        }

        function switchDefStage(idx, stage) {
            const skill = DEFENSE_SKILLS[idx];
            const descEl = document.getElementById('def-desc-' + idx).querySelector('.skill-desc-text');
            descEl.textContent = skill.desc[stage] || '';
            const tabs = document.getElementById('def-desc-' + idx).parentElement.querySelectorAll('.stage-tab');
            tabs.forEach(t => t.classList.remove('active'));
            const activeTab = Array.from(tabs).find(t => t.textContent.trim().startsWith(stage));
            if (activeTab) activeTab.classList.add('active');
        }

        const myData = IDENTITIES_INDEX.find(item => item.id === MY_ID);
        if (!myData) {
            document.body.innerHTML = '<div style="text-align:center;color:var(--gold);padding:60px;"><h2>人格未找到</h2><p>请在索引文件中添加此人格，或检查 MY_ID 是否正确。</p><a href="/loomcompanywiki/data/identities.html" style="color:var(--gold-dim);">← 返回人格列表</a></div>';
            throw new Error('人格未找到：' + MY_ID);
        }

        renderSkills();
        renderPassives();
        renderVoices();

        document.getElementById('identityName').textContent = MY_ID;
        document.getElementById('updateTime').textContent = UPDATE_TIME;
        document.getElementById('extractDisplay').textContent = myData.extract;
        document.getElementById('storyLink').href = '/loomcompanywiki/story/identity-story/' + MY_ID + '.html';

        const s = myData;
        document.getElementById('egoResources').innerHTML = `
            <span class="ego-resource-item"><img src="/loomcompanywiki/img/${s.skillTop.sin}.png"> ×3</span>
            <span class="ego-resource-item"><img src="/loomcompanywiki/img/${s.skillMiddle.sin}.png"> ×2</span>
            <span class="ego-resource-item"><img src="/loomcompanywiki/img/${s.skillBottom.sin}.png"> ×1</span>`;
        document.getElementById('keywordsDisplay').textContent = (myData.keywords || []).join(' / ');

        const r = myData.resist;
        document.getElementById('resistDisplay').innerHTML = `
            <span class="resist-item"><img src="/loomcompanywiki/img/${r.slash.physics}.png"> ${r.slash.resistance}</span>
            <span class="resist-item"><img src="/loomcompanywiki/img/${r.pierce.physics}.png"> ${r.pierce.resistance}</span>
            <span class="resist-item"><img src="/loomcompanywiki/img/${r.blunt.physics}.png"> ${r.blunt.resistance}</span>`;

        document.getElementById('levelInput').value = DEFAULT_LEVEL;
        document.getElementById('hpBase').textContent = HP_BASE;
        document.getElementById('hpGrowth').textContent = HP_GROWTH;
        document.getElementById('defBase').textContent = DEF_BASE;
        document.getElementById('defShift').textContent = (DEF_SHIFT >= 0 ? '+' : '') + DEF_SHIFT;
        document.getElementById('staggerBase').textContent = STAGGER_RATIOS.join(' ');

        let speedHTML = '';
        for (const [key, val] of Object.entries(SPEED)) {
            speedHTML += '<span class="speed-item">' + key + ' <span>' + val.min + '-' + val.max + '</span></span>';
        }
        document.getElementById('speedDisplay').innerHTML = speedHTML || '（未设置）';
        document.getElementById('sanityPositive').innerHTML = SANITY_POSITIVE.map(t => '<li>' + t + '</li>').join('') || '<li>（未设置）</li>';
        document.getElementById('sanityNegative').innerHTML = SANITY_NEGATIVE.map(t => '<li>' + t + '</li>').join('') || '<li>（未设置）</li>';

        function updateStats() {
            const level = parseInt(document.getElementById('levelInput').value) || 1;
            document.getElementById('hpValue').textContent = Math.floor(HP_BASE + HP_GROWTH * level);
            document.getElementById('defValue').textContent = Math.floor(DEF_BASE * level + DEF_SHIFT);
            document.getElementById('staggerValues').textContent = STAGGER_RATIOS.map(r => Math.floor((HP_BASE + HP_GROWTH * level) * r)).join(' ');
        }
        updateStats();
    </script>
    <script>
        fetch('/loomcompanywiki/nav.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('nav-placeholder').innerHTML = html;
                const current = document.querySelector('[data-nav="identities"]');
                if (current) current.classList.add('active');
            });
    </script>
</body>
</html>
