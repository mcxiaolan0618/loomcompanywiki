<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人格详情 - Loom Company 同人维基</title>
    <link rel="stylesheet" href="/loomcompanywiki/css/style.css">
    <link rel="stylesheet" href="/loomcompanywiki/data/identity/人格/css/sin.css">
    <style>
        .identity-detail {
            max-width: 800px;
            margin: 0 auto;
            padding: 24px 16px;
        }
        .identity-detail .back-link {
            display: inline-block;
            color: var(--gold);
            text-decoration: none;
            font-size: 0.85rem;
            margin-bottom: 16px;
            padding: 4px 12px;
            border: 1px solid var(--gold-dim);
            border-radius: 4px;
        }
        .identity-detail .back-link:hover { background: rgba(201,166,92,0.1); }

        .detail-title {
            text-align: center;
            color: var(--gold);
            font-size: 1.8rem;
            letter-spacing: 3px;
            margin-bottom: 24px;
        }

        .info-card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .info-card h3 {
            color: var(--gold);
            font-size: 1rem;
            letter-spacing: 2px;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .info-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 10px;
            font-size: 0.85rem;
        }
        .info-item { color: var(--text-dim); }
        .info-item strong { color: var(--text); }

        .ego-resources {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 6px;
        }
        .ego-resources img { width: 28px; height: 28px; }
        .ego-resource-item {
            display: flex;
            align-items: center;
            gap: 3px;
            color: var(--text-dim);
            font-size: 0.85rem;
        }

        .resist-display {
            display: flex;
            gap: 14px;
            align-items: center;
        }
        .resist-display .resist-item {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--text-dim);
            font-size: 0.85rem;
        }
        .resist-display img { width: 24px; height: 24px; }

        .level-input-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }
        .level-input-row input {
            width: 80px;
            padding: 6px 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            font-size: 0.9rem;
            font-family: inherit;
            text-align: center;
        }
        .level-input-row input:focus { border-color: var(--gold); outline: none; }
        .level-input-row .label { color: var(--text-dim); font-size: 0.85rem; }

        .stat-row {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }
        .stat-row .stat-label { color: var(--text-dim); min-width: 70px; }
        .stat-row .stat-value { color: var(--text); font-weight: bold; }
        .stat-row .stat-base { color: var(--text-dim); font-size: 0.78rem; }

        .speed-row { display: flex; gap: 12px; flex-wrap: wrap; }
        .speed-item { color: var(--text-dim); font-size: 0.82rem; }
        .speed-item span { color: var(--text); }

        .story-link {
            color: var(--gold);
            text-decoration: none;
            font-size: 0.85rem;
        }
        .story-link:hover { text-decoration: underline; }

        .sanity-section { margin-top: 14px; }
        .sanity-box {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }
        .sanity-box.positive {
            border: 1px solid #3a6ab5;
            background: rgba(58,106,181,0.08);
        }
        .sanity-box.positive .sanity-title {
            color: #5a9af5;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .sanity-box.negative {
            border: 1px solid #8b3a3a;
            background: rgba(139,58,58,0.08);
        }
        .sanity-box.negative .sanity-title {
            color: #d04a4a;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .sanity-box ul { list-style: none; padding: 0; margin: 0; }
        .sanity-box li { color: var(--text-dim); padding: 2px 0; }
        .sanity-box li::before { content: '• '; }

        /* ========== 技能卡片 ========== */
        .skill-card {
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .skill-card .skill-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .skill-card .skill-name {
            font-weight: bold;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
        .skill-card .skill-icons {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .skill-card .skill-icons img {
            width: 22px;
            height: 22px;
        }
        .skill-card .skill-icons .icon-label {
            font-size: 0.75rem;
            color: var(--text-dim);
        }
        .skill-card .stage-tabs {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .skill-card .stage-tab {
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.72rem;
            font-family: inherit;
            transition: all 0.2s;
        }
        .skill-card .stage-tab:hover { border-color: var(--gold); color: var(--gold); }
        .skill-card .stage-tab.active {
            border-color: var(--sin-border);
            background: var(--sin-bg);
            color: var(--sin-color);
            font-weight: bold;
        }
        .skill-card .skill-desc-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .skill-card .skill-desc-row img {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .skill-card .skill-desc-text {
            color: var(--text-dim);
            font-size: 0.8rem;
            line-height: 1.6;
        }

        .skill-card .skill-desc-text .sin-text { font-weight: bold; }
        .sin-text.sin-wrath { color: #d0423a; }
        .sin-text.sin-lust { color: #e8883a; }
        .sin-text.sin-sloth { color: #c9a62c; }
        .sin-text.sin-gluttony { color: #5a9a3a; }
        .sin-text.sin-gloom { color: #3a8aaa; }
        .sin-text.sin-pride { color: #3a5ab5; }
        .sin-text.sin-envy { color: #7a3a9a; }

        .skill-card.defense-card .stage-tab.active {
            border-color: #8a7e6b;
            background: rgba(138,126,107,0.12);
            color: #b0a590;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="nav-placeholder"></div>

    <div class="identity-detail">
        <a href="/loomcompanywiki/data/identities.html" class="back-link">← 返回人格列表</a>

        <h1 class="detail-title" id="identityName"></h1>

        <!-- 人格信息 -->
        <div class="info-card">
            <h3>人格信息</h3>

            <div class="info-row">
                <span class="info-item"><strong>更新时间</strong> <span id="updateTime"></span></span>
                <span class="info-item"><strong>获取方式</strong> <span id="extractDisplay"></span></span>
            </div>

            <div class="info-row">
                <span class="info-item"><strong><a id="storyLink" class="story-link">观看剧情</a></strong></span>
            </div>

            <div class="ego-resources" id="egoResources"></div>

            <div class="info-row" style="margin-top:8px;">
                <span class="info-item"><strong>特性关键词</strong> <span id="keywordsDisplay"></span></span>
            </div>

            <div class="info-row">
                <span class="info-item"><strong>物理抗性</strong></span>
                <div class="resist-display" id="resistDisplay"></div>
            </div>

            <div style="margin-top:16px;">
                <h3>能力值</h3>

                <div class="level-input-row">
                    <span class="label">请输入等级</span>
                    <input type="number" id="levelInput" min="1" max="50" onchange="updateStats()">
                </div>

                <div class="stat-row">
                    <span class="stat-label">生命值：</span>
                    <span class="stat-value" id="hpValue"></span>
                    <span class="stat-base">基础值：<span id="hpBase"></span></span>
                    <span class="stat-base">成长系数：<span id="hpGrowth"></span></span>
                </div>

                <div class="stat-row">
                    <span class="stat-label">防御等级：</span>
                    <span class="stat-value" id="defValue"></span>
                    <span class="stat-base">基础值：<span id="defBase"></span></span>
                    <span class="stat-base">变动值：<span id="defShift"></span></span>
                </div>

                <div class="stat-row">
                    <span class="stat-label">混乱阈值：</span>
                    <span class="stat-value" id="staggerValues"></span>
                    <span class="stat-base">基础值：<span id="staggerBase"></span></span>
                </div>

                <div class="stat-row">
                    <span class="stat-label">速度：</span>
                    <div class="speed-row" id="speedDisplay"></div>
                </div>
            </div>

            <div class="sanity-section">
                <h3>理智值</h3>
                <div class="sanity-box positive">
                    <div class="sanity-title">基础理智值增加条件</div>
                    <ul id="sanityPositive"></ul>
                </div>
                <div class="sanity-box negative">
                    <div class="sanity-title">基础理智值减少条件</div>
                    <ul id="sanityNegative"></ul>
                </div>
            </div>
        </div>

        <!-- 技能 -->
        <div id="skillsContainer"></div>

    </div>

    <div class="footer">Loom Company 同人维基 · 此为一个镜世界中的故事</div>

    <script src="/loomcompanywiki/data/identities.js"></script>
    <script>
        const MY_ID = '在此填写人格id，如：LCR员工-萨尔温';

        const DEFAULT_LEVEL = 30;
        const UPDATE_TIME = '在此填写更新时间';
        const HP_BASE = 0;
        const HP_GROWTH = 0;
        const DEF_BASE = 0;
        const DEF_SHIFT = 0;
        const STAGGER_RATIOS = [0, 0, 0];
        const SPEED = {
            I:  { min: 0, max: 0 },
            II: { min: 0, max: 0 },
            III:{ min: 0, max: 0 },
            IV: { min: 0, max: 0 }
        };
        const SANITY_POSITIVE = [];
        const SANITY_NEGATIVE = [];

        const SKILLS = [
            {
                name: '技能一名称',
                sin: '暴怒',
                count: 3,
                coin: 0,
                attack: 0,
                capacity: 0,
                stages: ['I', 'II', 'III', 'IV'],
                skillImg: '技能-物理-罪孽.png',
                desc: {
                    'I': 'I阶段技能描述',
                    'II': 'II阶段技能描述',
                    'III': 'III阶段技能描述',
                    'IV': 'IV阶段技能描述'
                }
            },
            {
                name: '技能二名称',
                sin: '色欲',
                count: 2,
                coin: 0,
                attack: 0,
                capacity: 0,
                stages: ['I', 'II', 'III', 'IV'],
                skillImg: '技能-物理-罪孽.png',
                desc: {
                    'I': 'I阶段技能描述',
                    'II': 'II阶段技能描述',
                    'III': 'III阶段技能描述',
                    'IV': 'IV阶段技能描述'
                }
            },
            {
                name: '技能三名称',
                sin: '怠惰',
                count: 1,
                coin: 0,
                attack: 0,
                capacity: 0,
                stages: ['III', 'IV'],
                skillImg: '技能-物理-罪孽.png',
                desc: {
                    'III': 'III阶段技能描述',
                    'IV': 'IV阶段技能描述'
                }
            },
        ];

        const DEFENSE_SKILLS = [
            {
                name: '守备技能名称',
                coin: 0,
                defense: 0,
                capacity: 0,
                stages: ['I-III', 'IV'],
                desc: {
                    'I-III': 'I-III阶段技能描述',
                    'IV': 'IV阶段技能描述'
                },
                extraSin: '傲慢',
            },
        ];

        const SIN_MAP = {
            '暴怒': 'wrath',
            '色欲': 'lust',
            '怠惰': 'sloth',
            '暴食': 'gluttony',
            '忧郁': 'gloom',
            '傲慢': 'pride',
            '嫉妒': 'envy'
        };

        function renderSkills() {
            const container = document.getElementById('skillsContainer');
            let html = '';

            SKILLS.forEach((skill, idx) => {
                const sinEn = SIN_MAP[skill.sin] || 'wrath';
                const defaultStage = skill.stages[skill.stages.length - 1];
                html += `
                <div class="info-card skill-card sin-${sinEn}">
                    <div class="skill-header">
                        <span class="skill-name sin-text sin-${sinEn}">${skill.name}</span>
                        <span class="sin-text sin-${sinEn}">×${skill.count}</span>
                        <span class="skill-icons">
                            <img src="/loomcompanywiki/img/Coin.png"> ×${skill.coin}
                        </span>
                        <span class="skill-icons">
                            <img src="/loomcompanywiki/img/Attack.png"> ${skill.attack}
                        </span>
                        <span class="skill-icons">
                            <img src="/loomcompanywiki/img/容量.png"> ×${skill.capacity}
                        </span>
                    </div>
                    <div class="stage-tabs">
                        ${skill.stages.map(s => `<button class="stage-tab${s === defaultStage ? ' active' : ''}" onclick="switchStage('skill',${idx},'${s}')">${s}阶段</button>`).join('')}
                    </div>
                    <div class="skill-desc-row" id="skill-desc-${idx}">
                        <img src="/loomcompanywiki/img/${skill.skillImg}" onerror="this.style.display='none'">
                        <span class="skill-desc-text">${skill.desc[defaultStage] || ''}</span>
                    </div>
                </div>`;
            });

            DEFENSE_SKILLS.forEach((skill, idx) => {
                const defaultStage = skill.stages[skill.stages.length - 1];
                html += `
                <div class="info-card skill-card defense-card">
                    <div class="skill-header">
                        <span class="skill-name" style="color:#b0a590;">${skill.name}</span>
                        <span class="skill-icons">
                            <img src="/loomcompanywiki/img/Coin.png"> ×${skill.coin}
                        </span>
                        <span class="skill-icons">
                            <img src="/loomcompanywiki/img/守备.png"> ${skill.defense}
                        </span>
                        <span class="skill-icons">
                            <img src="/loomcompanywiki/img/容量.png"> ×${skill.capacity}
                        </span>
                    </div>
                    <div class="stage-tabs">
                        ${skill.stages.map(s => `<button class="stage-tab${s === defaultStage ? ' active' : ''}" onclick="switchDefStage(${idx},'${s}')">${s}阶段${s === 'IV' && skill.extraSin ? ' 追加：' + skill.extraSin : ''}</button>`).join('')}
                    </div>
                    <div class="skill-desc-row" id="def-desc-${idx}">
                        <img src="/loomcompanywiki/img/${skill.extraSin ? skill.extraSin + '.png' : ''}" onerror="this.style.display='none'">
                        <span class="skill-desc-text">${skill.desc[defaultStage] || ''}</span>
                    </div>
                </div>`;
            });

            container.innerHTML = html;
        }

        function switchStage(type, idx, stage) {
            const skill = SKILLS[idx];
            const descEl = document.getElementById('skill-desc-' + idx).querySelector('.skill-desc-text');
            descEl.textContent = skill.desc[stage] || '';
            const tabs = document.getElementById('skill-desc-' + idx).parentElement.querySelectorAll('.stage-tab');
            tabs.forEach(t => t.classList.remove('active'));
            const activeTab = Array.from(tabs).find(t => t.textContent.trim().startsWith(stage));
            if (activeTab) activeTab.classList.add('active');
        }

        function switchDefStage(idx, stage) {
            const skill = DEFENSE_SKILLS[idx];
            const descEl = document.getElementById('def-desc-' + idx).querySelector('.skill-desc-text');
            descEl.textContent = skill.desc[stage] || '';
            const tabs = document.getElementById('def-desc-' + idx).parentElement.querySelectorAll('.stage-tab');
            tabs.forEach(t => t.classList.remove('active'));
            const activeTab = Array.from(tabs).find(t => t.textContent.trim().startsWith(stage));
            if (activeTab) activeTab.classList.add('active');
        }

        renderSkills();

        // ===== 上半部分渲染 =====
        const myData = IDENTITIES_INDEX.find(item => item.id === MY_ID);

        if (!myData) {
            document.body.innerHTML = '<div style="text-align:center;color:var(--gold);padding:60px;"><h2>人格未找到</h2><p>请在索引文件中添加此人格，或检查 MY_ID 是否正确。</p><a href="/loomcompanywiki/data/identities.html" style="color:var(--gold-dim);">← 返回人格列表</a></div>';
            throw new Error('人格未找到：' + MY_ID);
        }

        document.getElementById('identityName').textContent = MY_ID;
        document.getElementById('updateTime').textContent = UPDATE_TIME;
        document.getElementById('extractDisplay').textContent = myData.extract;

        const storyLink = document.getElementById('storyLink');
        storyLink.href = '/loomcompanywiki/story/identity-story/' + MY_ID + '.html';

        const s = myData;
        const egoHTML = `
            <span class="ego-resource-item"><img src="/loomcompanywiki/img/${s.skillTop.sin}.png"> ×3</span>
            <span class="ego-resource-item"><img src="/loomcompanywiki/img/${s.skillMiddle.sin}.png"> ×2</span>
            <span class="ego-resource-item"><img src="/loomcompanywiki/img/${s.skillBottom.sin}.png"> ×1</span>
        `;
        document.getElementById('egoResources').innerHTML = egoHTML;

        document.getElementById('keywordsDisplay').textContent = (myData.keywords || []).join(' / ');

        const r = myData.resist;
        const resistHTML = `
            <span class="resist-item"><img src="/loomcompanywiki/img/${r.slash.physics}.png"> ${r.slash.resistance}</span>
            <span class="resist-item"><img src="/loomcompanywiki/img/${r.pierce.physics}.png"> ${r.pierce.resistance}</span>
            <span class="resist-item"><img src="/loomcompanywiki/img/${r.blunt.physics}.png"> ${r.blunt.resistance}</span>
        `;
        document.getElementById('resistDisplay').innerHTML = resistHTML;

        document.getElementById('levelInput').value = DEFAULT_LEVEL;

        document.getElementById('hpBase').textContent = HP_BASE;
        document.getElementById('hpGrowth').textContent = HP_GROWTH;
        document.getElementById('defBase').textContent = DEF_BASE;
        document.getElementById('defShift').textContent = (DEF_SHIFT >= 0 ? '+' : '') + DEF_SHIFT;
        document.getElementById('staggerBase').textContent = STAGGER_RATIOS.join(' ');

        let speedHTML = '';
        for (const [key, val] of Object.entries(SPEED)) {
            speedHTML += `<span class="speed-item">${key} <span>${val.min}-${val.max}</span></span>`;
        }
        document.getElementById('speedDisplay').innerHTML = speedHTML || '（未设置）';

        document.getElementById('sanityPositive').innerHTML = SANITY_POSITIVE.map(t => `<li>${t}</li>`).join('') || '<li>（未设置）</li>';
        document.getElementById('sanityNegative').innerHTML = SANITY_NEGATIVE.map(t => `<li>${t}</li>`).join('') || '<li>（未设置）</li>';

        function updateStats() {
            const level = parseInt(document.getElementById('levelInput').value) || 1;
            const hp = Math.floor(HP_BASE + HP_GROWTH * level);
            document.getElementById('hpValue').textContent = hp;
            const def = Math.floor(DEF_BASE * level + DEF_SHIFT);
            document.getElementById('defValue').textContent = def;
            const staggerValues = STAGGER_RATIOS.map(r => Math.floor(hp * r));
            document.getElementById('staggerValues').textContent = staggerValues.join(' ');
        }
        updateStats();
    </script>

    <script>
        fetch('/loomcompanywiki/nav.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('nav-placeholder').innerHTML = html;
                const current = document.querySelector('[data-nav="identities"]');
                if (current) current.classList.add('active');
            });
    </script>

</body>
</html>
