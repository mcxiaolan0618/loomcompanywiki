<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGO详情 - Loom Company 同人维基</title>
    <link rel="stylesheet" href="/loomcompanywiki/css/style.css">
    <style>
        .ego-detail {
            max-width: 800px;
            margin: 0 auto;
            padding: 24px 16px;
        }
        .ego-detail .back-link {
            display: inline-block;
            color: var(--gold);
            text-decoration: none;
            font-size: 0.85rem;
            margin-bottom: 16px;
            padding: 4px 12px;
            border: 1px solid var(--gold-dim);
            border-radius: 4px;
        }
        .ego-detail .back-link:hover { background: rgba(201,166,92,0.1); }

        .detail-title {
            text-align: center;
            color: var(--gold);
            font-size: 1.8rem;
            letter-spacing: 3px;
            margin-bottom: 24px;
        }
        .detail-title .owner-links {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-top: 6px;
        }
        .detail-title .owner-links a {
            color: var(--gold-dim);
            text-decoration: none;
            margin: 0 4px;
        }
        .detail-title .owner-links a:hover { text-decoration: underline; }

        .info-card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .info-card h3 {
            color: var(--gold);
            font-size: 1rem;
            letter-spacing: 2px;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .info-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 10px;
            font-size: 0.85rem;
            align-items: center;
        }
        .info-item { color: var(--text-dim); }
        .info-item strong { color: var(--text); }

        .resource-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 6px;
        }
        .resource-row img { width: 22px; height: 22px; }
        .resource-item {
            display: flex;
            align-items: center;
            gap: 2px;
            color: var(--text-dim);
            font-size: 0.8rem;
        }

        .resist-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .resist-item {
            display: flex;
            align-items: center;
            gap: 3px;
            color: var(--text-dim);
            font-size: 0.8rem;
        }
        .resist-item img { width: 22px; height: 22px; }

        .stage-tabs {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .stage-tab {
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.72rem;
            font-family: inherit;
            transition: all 0.2s;
        }
        .stage-tab:hover { border-color: var(--gold); color: var(--gold); }
        .stage-tab.active {
            border-color: var(--gold-dim);
            background: rgba(201,166,92,0.1);
            color: var(--gold);
            font-weight: bold;
        }

        .skill-header-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }
        .skill-header-row img { width: 22px; height: 22px; }
        .skill-desc-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 6px;
        }
        .skill-desc-row img { width: 28px; height: 28px; flex-shrink: 0; margin-top: 2px; }
        .skill-desc-text {
            color: var(--text-dim);
            font-size: 0.8rem;
            line-height: 1.6;
            white-space: pre-line;
        }
        .skill-voice {
            color: var(--text-dim);
            font-size: 0.78rem;
            font-style: italic;
            margin-top: 4px;
        }

        .passive-block { margin-top: 8px; }
        .passive-name { color: var(--text); font-weight: bold; font-size: 0.9rem; }
        .passive-effect { color: var(--text-dim); font-size: 0.8rem; line-height: 1.5; }

        .abno-link {
            color: var(--gold);
            text-decoration: none;
        }
        .abno-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div id="nav-placeholder"></div>

    <div class="ego-detail">
        <a href="/loomcompanywiki/data/egos.html" class="back-link">← 返回EGO列表</a>

        <h1 class="detail-title" id="egoTitle"></h1>

        <!-- 基础信息 -->
        <div class="info-card">
            <h3>基础</h3>

            <div class="info-row">
                <span id="egoLevelImg"></span>
                <span class="info-item"><strong id="egoFullName"></strong></span>
            </div>

            <div class="info-row">
                <span class="info-item"><strong>登场时间</strong> <span id="releaseTime"></span></span>
                <span class="info-item"><strong>获取方式</strong> <span id="obtainWay"></span></span>
            </div>

            <div class="resource-row" id="resources"></div>

            <div class="info-row" style="margin-top:6px;">
                <span class="info-item"><strong>罪孽抗性</strong></span>
                <div class="resist-row" id="sinResists"></div>
            </div>
        </div>

        <!-- 觉醒 -->
        <div class="info-card">
            <h3>E.G.O.觉醒</h3>

            <div class="skill-header-row">
                <span class="info-item">硬币：<img src="/loomcompanywiki/img/Coin.png"> ×<span id="awakeCoin"></span></span>
                <span class="info-item">理智消耗：<img src="/loomcompanywiki/img/sans.png"> <span id="awakeSanity"></span></span>
                <span class="info-item"><img src="/loomcompanywiki/img/Attack.png"> <span id="awakeAttack"></span></span>
            </div>

            <div class="stage-tabs" id="awakeTabs"></div>
            <div class="skill-desc-row" id="awakeDescRow">
                <img id="awakeSkillImg" src="" onerror="this.style.display='none'">
                <span class="skill-desc-text" id="awakeDesc"></span>
            </div>
            <div class="skill-voice" id="awakeVoice"></div>
        </div>

        <!-- 侵蚀 -->
        <div class="info-card">
            <h3>E.G.O.侵蚀</h3>

            <div class="skill-header-row">
                <span class="info-item">硬币：<img src="/loomcompanywiki/img/Coin.png"> ×<span id="corrodeCoin"></span></span>
                <span class="info-item">理智消耗：<img src="/loomcompanywiki/img/sans.png"> <span id="corrodeSanity"></span></span>
                <span class="info-item"><img src="/loomcompanywiki/img/Attack.png"> <span id="corrodeAttack"></span></span>
            </div>

            <div class="stage-tabs" id="corrodeTabs"></div>
            <div class="skill-desc-row" id="corrodeDescRow">
                <img id="corrodeSkillImg" src="" onerror="this.style.display='none'">
                <span class="skill-desc-text" id="corrodeDesc"></span>
            </div>
            <div class="skill-voice" id="corrodeVoice"></div>
        </div>

        <!-- 被动 -->
        <div class="info-card">
            <h3>被动</h3>
            <div class="passive-block">
                <div class="passive-name" id="passiveName"></div>
                <div class="passive-effect" id="passiveEffect"></div>
            </div>
        </div>

        <!-- 相关异想体 -->
        <div class="info-card">
            <h3>相关异想体</h3>
            <div id="abnoInfo"></div>
        </div>

    </div>

    <div class="footer">Loom Company 同人维基 · 此为一个镜世界中的故事</div>

    <script>
        /*
        ╔══════════════════════════════════════════╗
        ║  变量区 - 修改以下数值即可             ║
        ╚══════════════════════════════════════════╝
        */

        // ===== EGO名称与等级 =====
        const EGO_NAME = '在此填写EGO名称';
        const EGO_LEVEL = 'ZAYIN';

        // ===== 持有此EGO的角色（至少一个）=====
        const OWNERS = [
            { name: '角色名', file: 'EGO名称-角色名' },
            // 如果有多个角色拥有相同EGO，添加更多
            // { name: '角色名2', file: 'EGO名称-角色名2' },
        ];

        // ===== 基础信息 =====
        const RELEASE_TIME = '在此填写登场时间';
        const OBTAIN_WAY = '在此填写获取方式';

        // ===== 资源消耗（数组，可多个）=====
        const RESOURCES = [
            // { sin: '嫉妒', count: 5 },
            // { sin: '忧郁', count: 2 },
            // { sin: '暴食', count: 2 },
        ];

        // ===== 罪孽抗性（数组，3个或7个）=====
        const SIN_RESISTS = [
            // { sin: '暴怒', value: '2.0' },
            // { sin: '色欲', value: '1.0' },
            // { sin: '怠惰', value: '0.5' },
        ];

        // ===== 觉醒 =====
        const AWAKE_COIN = 0;
        const AWAKE_SANITY = 0;
        const AWAKE_ATTACK = 0;
        const AWAKE_SKILL_IMG = '技能-物理-罪孽.png';
        const AWAKE_STAGES = ['I', 'II', 'III', 'IV'];
        const AWAKE_DESC = {
            'I': '在此填写I阶段效果',
            'II': '在此填写II阶段效果',
            'III': '在此填写III阶段效果',
            'IV': '在此填写IV阶段效果'
        };
        const AWAKE_VOICE = '在此填写台词';

        // ===== 侵蚀 =====
        const CORRODE_COIN = 0;
        const CORRODE_SANITY = 0;
        const CORRODE_ATTACK = 0;
        const CORRODE_SKILL_IMG = '技能-物理-罪孽.png';
        const CORRODE_STAGES = ['I', 'II', 'III', 'IV'];
        const CORRODE_DESC = {
            'I': '在此填写I阶段效果',
            'II': '在此填写II阶段效果',
            'III': '在此填写III阶段效果',
            'IV': '在此填写IV阶段效果'
        };
        const CORRODE_VOICE = '在此填写台词';

        // ===== 被动 =====
        const PASSIVE_NAME = '在此填写被动名称';
        const PASSIVE_EFFECT = '在此填写被动效果';

        // ===== 相关异想体 =====
        const ABNO_LEVEL = 'ZAYIN';
        const ABNO_CODE = '在此填写编号';
        const ABNO_NAME = '在此填写异想体名字';

        /*
        ╔══════════════════════════════════════════╗
        ║  渲染逻辑 - 以下无需修改               ║
        ╚══════════════════════════════════════════╝
        */

        // 标题
        const currentOwner = OWNERS[0].name;
        document.getElementById('egoTitle').textContent = EGO_NAME + '-' + currentOwner;
        if (OWNERS.length > 1) {
            let linksHTML = '（';
            OWNERS.forEach((o, i) => {
                linksHTML += '<a href="' + o.file + '.html">' + o.name + '</a>';
                if (i < OWNERS.length - 1) linksHTML += ' / ';
            });
            linksHTML += '）';
            document.getElementById('egoTitle').innerHTML += '<div class="owner-links">' + linksHTML + '</div>';
        }

        // 基础信息
        document.getElementById('egoLevelImg').innerHTML = '<img src="/loomcompanywiki/img/' + EGO_LEVEL + '.png" style="width:56px;height:24px;object-fit:contain;">';
        document.getElementById('egoFullName').textContent = EGO_NAME + '-' + currentOwner;
        document.getElementById('releaseTime').textContent = RELEASE_TIME;
        document.getElementById('obtainWay').textContent = OBTAIN_WAY;

        // 资源
        document.getElementById('resources').innerHTML = RESOURCES.map(r =>
            '<span class="resource-item"><img src="/loomcompanywiki/img/' + r.sin + '.png"> ×' + r.count + '</span>'
        ).join('');

        // 罪孽抗性
        document.getElementById('sinResists').innerHTML = SIN_RESISTS.map(r =>
            '<span class="resist-item"><img src="/loomcompanywiki/img/' + r.sin + '.png"> ' + r.value + '</span>'
        ).join('');

        // 觉醒
        document.getElementById('awakeCoin').textContent = AWAKE_COIN;
        document.getElementById('awakeSanity').textContent = AWAKE_SANITY;
        document.getElementById('awakeAttack').textContent = AWAKE_ATTACK;
        document.getElementById('awakeSkillImg').src = '/loomcompanywiki/img/' + AWAKE_SKILL_IMG;
        document.getElementById('awakeVoice').textContent = AWAKE_VOICE;

        const awakeDefault = AWAKE_STAGES[AWAKE_STAGES.length - 1];
        document.getElementById('awakeTabs').innerHTML = AWAKE_STAGES.map(s =>
            '<button class="stage-tab' + (s === awakeDefault ? ' active' : '') + '" onclick="switchAwakeStage(\'' + s + '\')">' + s + '阶段</button>'
        ).join('');
        document.getElementById('awakeDesc').textContent = AWAKE_DESC[awakeDefault] || '';

        window.switchAwakeStage = function(stage) {
            document.getElementById('awakeDesc').textContent = AWAKE_DESC[stage] || '';
            document.querySelectorAll('#awakeTabs .stage-tab').forEach(t => t.classList.remove('active'));
            const btn = Array.from(document.querySelectorAll('#awakeTabs .stage-tab')).find(t => t.textContent.trim().startsWith(stage));
            if (btn) btn.classList.add('active');
        };

        // 侵蚀
        document.getElementById('corrodeCoin').textContent = CORRODE_COIN;
        document.getElementById('corrodeSanity').textContent = CORRODE_SANITY;
        document.getElementById('corrodeAttack').textContent = CORRODE_ATTACK;
        document.getElementById('corrodeSkillImg').src = '/loomcompanywiki/img/' + CORRODE_SKILL_IMG;
        document.getElementById('corrodeVoice').textContent = CORRODE_VOICE;

        const corrodeDefault = CORRODE_STAGES[CORRODE_STAGES.length - 1];
        document.getElementById('corrodeTabs').innerHTML = CORRODE_STAGES.map(s =>
            '<button class="stage-tab' + (s === corrodeDefault ? ' active' : '') + '" onclick="switchCorrodeStage(\'' + s + '\')">' + s + '阶段</button>'
        ).join('');
        document.getElementById('corrodeDesc').textContent = CORRODE_DESC[corrodeDefault] || '';

        window.switchCorrodeStage = function(stage) {
            document.getElementById('corrodeDesc').textContent = CORRODE_DESC[stage] || '';
            document.querySelectorAll('#corrodeTabs .stage-tab').forEach(t => t.classList.remove('active'));
            const btn = Array.from(document.querySelectorAll('#corrodeTabs .stage-tab')).find(t => t.textContent.trim().startsWith(stage));
            if (btn) btn.classList.add('active');
        };

        // 被动
        document.getElementById('passiveName').textContent = PASSIVE_NAME;
        document.getElementById('passiveEffect').textContent = PASSIVE_EFFECT;

        // 异想体
        const abnoLevelColors = {
            'ZAYIN': '#5a9a5a', 'TETH': '#5a8aaa', 'HE': '#c9a62c', 'WAW': '#8b3a6b', 'ALEPH': '#8b3a3a'
        };
        document.getElementById('abnoInfo').innerHTML = `
            <span style="color:${abnoLevelColors[ABNO_LEVEL] || '#fff'};font-weight:bold;">${ABNO_LEVEL}</span>
            <span style="color:var(--text-dim);margin:0 8px;">${ABNO_CODE}</span>
            <a href="/loomcompanywiki/data/abnormalities/abnormality/${ABNO_NAME}.html" class="abno-link">${ABNO_NAME}</a>
        `;
    </script>

    <script>
        fetch('/loomcompanywiki/nav.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('nav-placeholder').innerHTML = html;
                const current = document.querySelector('[data-nav="egos"]');
                if (current) current.classList.add('active');
            });
    </script>

</body>
</html>
