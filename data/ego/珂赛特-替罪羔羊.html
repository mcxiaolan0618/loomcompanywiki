<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGO详情 - Loom Company 同人维基</title>
    <link rel="stylesheet" href="/loomcompanywiki/css/style.css">
    <link rel="stylesheet" href="/loomcompanywiki/data/identity/css/sin.css">

    <style>
        .ego-detail {
            max-width: 800px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        .ego-detail .back-link {
            display: inline-block;
            color: var(--gold);
            text-decoration: none;
            font-size: 1rem;
            margin-bottom: 16px;
            padding: 4px 12px;
            border: 1px solid var(--gold-dim);
            border-radius: 4px;
        }

        .ego-detail .back-link:hover {
            background: rgba(201, 166, 92, 0.1);
        }

        .detail-title {
            text-align: center;
            color: var(--gold);
            font-size: 1.8rem;
            letter-spacing: 3px;
            margin-bottom: 24px;
        }

        .detail-title .owner-links {
            font-size: 1;
            color: var(--text-dim);
            margin-top: 6px;
        }

        .detail-title .owner-links a {
            color: var(--gold-dim);
            text-decoration: none;
            margin: 0 4px;
        }

        .detail-title .owner-links a:hover {
            text-decoration: underline;
        }

        .info-card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .info-card.sin-frame {
            border: 1px solid var(--sin-border) !important;
            border-left: 4px solid var(--sin-accent) !important;
            background-color: var(--sin-bg) !important;
            box-shadow: 0 0 10px var(--sin-glow), inset 0 0 10px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .info-card.sin-frame::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-bottom: 20px solid var(--sin-accent);
            opacity: 0.3;
        }

        .info-card h3 {
            color: var(--gold);
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .info-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 10px;
            font-size: 1rem;
            align-items: center;
        }

        .info-item {
            color: var(--text-dim);
        }

        .info-item strong {
            color: var(--text);
        }

        .resource-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 6px;
        }

        .resource-row img {
            width: 22px;
            height: 22px;
        }

        .resource-item {
            display: flex;
            align-items: center;
            gap: 2px;
            color: var(--text-dim);
            font-size: 1rem;
        }

        .resist-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .resist-item {
            display: flex;
            align-items: center;
            gap: 3px;
            color: var(--text-dim);
            font-size: 1rem;
        }

        .resist-item img {
            width: 22px;
            height: 22px;
        }

        .stage-tabs {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .stage-tab {
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.72rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        .stage-tab:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .stage-tab.active {
            border-color: var(--sin-border);
            background: var(--sin-bg);
            color: var(--sin-color);
            font-weight: bold;
        }

        .skill-header-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .skill-header-row img {
            width: 22px;
            height: 22px;
        }

        .skill-desc-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 6px;
        }

        .skill-desc-row img {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .skill-desc-text {
            color: var(--text-dim);
            font-size: 1rem;
            line-height: 1.6;
            white-space: pre-line;
        }

        .skill-desc-text img {
            width: 20px;
            height: 20px;
            vertical-align: middle;
        }

        .skill-desc-text a {
            color: var(--gold);
            text-decoration: none;
        }

        .skill-desc-text a:hover {
            text-decoration: underline;
        }

        .skill-voice {
            color: #D8B4E2;
            font-size: 1.4rem;
            font-style: italic;
            margin-top: 4px;
        }

        .passive-block {
            margin-top: 8px;
        }

        .passive-name {
            color: var(--text);
            font-weight: bold;
            font-size: 0.9rem;
        }

        .passive-effect {
            color: var(--text-dim);
            font-size: 1rem;
            line-height: 1.5;
        }

        .passive-effect img {
            width: 20px;
            height: 20px;
            vertical-align: middle;
        }

        .passive-effect a {
            color: var(--gold);
            text-decoration: none;
        }

        .passive-effect a:hover {
            text-decoration: underline;
        }

        .abno-link {
            color: var(--gold);
            text-decoration: none;
        }

        .abno-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div id="nav-placeholder"></div>

    <div class="ego-detail">
        <a href="/loomcompanywiki/data/egos.html" class="back-link">← 返回EGO列表</a>

        <h1 class="detail-title" id="egoTitle"></h1>

        <div class="info-card">
            <h3>基础</h3>
            <div class="info-row">
                <span id="egoLevelImg"></span>
                <span class="info-item"><strong id="egoFullName"></strong></span>
            </div>
            <div class="info-row">
                <span class="info-item"><strong>登场时间</strong> <span id="releaseTime"></span></span>
                <span class="info-item"><strong>获取方式</strong> <span id="obtainWay"></span></span>
            </div>
            <div class="resource-row" id="resources"></div>
            <div class="info-row" style="margin-top:6px;">
                <span class="info-item"><strong>罪孽抗性</strong></span>
                <div class="resist-row" id="sinResists"></div>
            </div>
        </div>

        <div class="info-card sin-frame" id="awakeCard">
            <h3>E.G.O.觉醒</h3>
            <div class="skill-header-row">
                <span class="info-item">硬币：<img src="/loomcompanywiki/img/Coin.png"> ×<span id="awakeCoin"></span></span>
                <span class="info-item">理智消耗：<img src="/loomcompanywiki/img/sans.png"> <span id="awakeSanity"></span></span>
                <span class="info-item"><img src="/loomcompanywiki/img/Attack.png"> <span id="awakeAttack"></span></span>
            </div>
            <div class="stage-tabs" id="awakeTabs"></div>
            <div class="skill-desc-row">
                <img id="awakeSkillImg" src="">
                <span class="skill-desc-text" id="awakeDesc"></span>
            </div>
            <div class="skill-voice" id="awakeVoice"></div>
        </div>

        <div class="info-card">
            <h3>被动</h3>
            <div class="passive-block">
                <div class="passive-name" id="passiveName"></div>
                <div class="passive-effect" id="passiveEffect"></div>
            </div>
        </div>

        <div class="footer">Loom Company 同人维基 · 此为一个镜世界中的故事</div>

        <script src="/loomcompanywiki/data/status-effects.js"></script>

        <script>
            const EGO_NAME = '替罪羔羊';
            const EGO_LEVEL = 'ZAYIN';
            const OWNERS = [{ name: '珂赛特', file: '替罪羔羊-珂赛特' }];
            const RELEASE_TIME = '2026-9-2';
            const OBTAIN_WAY = '初始';
            const RESOURCES = [
                { sin: '怠惰', count: 1 },
                { sin: '暴食', count: 2 },
                { sin: '忧郁', count: 1 }
            ];
            const SIN_RESISTS = [
                { sin: '暴怒', value: '×2.0' },
                { sin: '怠惰', value: '×0.75' },
                { sin: '暴食', value: '×2.0' },
            ];

            const AWAKE_SIN = '怠惰';
            const AWAKE_COIN = 1;
            const AWAKE_SANITY = 10;
            const AWAKE_ATTACK = '-2';
            const AWAKE_SKILL_IMG = '技能-打击-怠惰.png';
            const AWAKE_STAGES = ['I', 'II', 'III', 'IV'];
            const AWAKE_DESC = {
                'I': '基础值:17\n变动值:+4\n攻击容量:1\nI [命中时]下回合对目标施加3层[防御等级降低]\n[命中时]下回合对自身施加3层[防御等级降低]\n[命中时]下回合对目标施加3层[防御等级降低]\n[命中时]下回合对自身施加2层[虚弱]',
                'II': '基础值:17\n变动值:+4\n攻击容量:1\nI [命中时]下回合对目标施加3层[防御等级降低]\n[命中时]下回合对自身施加3层[防御等级降低]\n[命中时]下回合对目标施加2层[虚弱]\n[命中时]下回合对自身施加2层[虚弱]',
                'III': '基础值:20\n变动值:+4\n攻击容量:1\nI [命中时]下回合对目标施加6层[防御等级降低]\n[命中时]下回合对自身施加6层[防御等级降低]\n[命中时]下回合对目标施加4层[虚弱]\n[命中时]下回合对自身施加4层[虚弱]',
                'IV': '基础值:20\n变动值:+4\n攻击容量:1\nI [命中时]下回合对目标施加6层[防御等级降低]\n[命中时]下回合对自身施加4层[防御等级降低]\n[命中时]下回合对目标施加4层[虚弱]\n[命中时]下回合对自身施加3层[虚弱]\n[命中时]下回合使所有友方获得2层[迅捷]'
            };
            const AWAKE_VOICE = '"如果注定要背负……那就让我来承受吧。"';

            const PASSIVE_NAME = '默认';
            const PASSIVE_STAGES = ['II'];
            const PASSIVE_EFFECTS = {
                'II': '自身受到攻击时，下回合对自身施加1层[束缚]与1层[麻痹]\n友方单位受到攻击时，下回合对攻击者受到的伤害+20%（1回合1次）'};

            const SIN_MAP = { '暴怒': 'wrath', '色欲': 'lust', '怠惰': 'sloth', '暴食': 'gluttony', '忧郁': 'gloom', '傲慢': 'pride',
                '嫉妒': 'envy' };

            function parseStatusEffects(text) {
                if (!text) return '';

                const tagColors = {
                    '命中时': '#5a9a5a', '未摧毁 - 命中时': '#5a9a5a', '战斗开始': '#5a9a5a',
                    '闪避成功时': '#5a9a5a', '无法改变拼点目标': '#5a9a5a', '击杀时': '#5a9a5a',
                    '可拼点防御': '#5a9a5a', '攻击后': '#5a9a5a', '反面命中时': '#5a9a5a',
                    '使用时': '#3a6ab5',
                    '正面命中时': '#7ab85c',
                    '无差别攻击': '#d04a4a', '拼点失败': '#d04a4a', '无法拼点': '#d04a4a',
                    '拼点胜利': '#e8883a', '可拼点反击': '#e8883a',
                    '正面攻击结束后': '#c06090',
                };

                for (const [tag, color] of Object.entries(tagColors)) {
                    const escapedTag = tag.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    text = text.replace(new RegExp('\\[' + escapedTag + '\\]', 'g'), '<span style="color:' + color +
                        ';font-weight:bold;">[' + tag + ']</span>');
                }

                text = text.replace(/\[(.+?)\]/g, (match, name) => {
                    if (STATUS_EFFECTS[name]) {
                        return '<img src="/loomcompanywiki/img/' + STATUS_EFFECTS[name].img +
                            '" style="width:20px;height:20px;vertical-align:middle;"> <a href="/loomcompanywiki/data/status-effects.html?q=' +
                            encodeURIComponent(name) + '">' + name + '</a>';
                    }
                    return match;
                });

                return text;
            }

            document.getElementById('awakeCard').classList.add('sin-' + (SIN_MAP[AWAKE_SIN] || 'wrath'));

            const currentOwner = OWNERS[0].name;
            document.getElementById('egoTitle').textContent = EGO_NAME + '-' + currentOwner;
            if (OWNERS.length > 1) {
                let linksHTML = '（';
                OWNERS.forEach((o, i) => {
                    linksHTML += '<a href="' + o.file + '.html">' + o.name + '</a>';
                    if (i < OWNERS.length - 1) linksHTML += ' / ';
                });
                linksHTML += '）';
                document.getElementById('egoTitle').innerHTML += '<div class="owner-links">' + linksHTML + '</div>';
            }

            document.getElementById('egoLevelImg').innerHTML = '<img src="/loomcompanywiki/img/' + EGO_LEVEL +
                '.png" style="width:56px;height:24px;object-fit:contain;">';
            document.getElementById('egoFullName').textContent = EGO_NAME + '-' + currentOwner;
            document.getElementById('releaseTime').textContent = RELEASE_TIME;
            document.getElementById('obtainWay').textContent = OBTAIN_WAY;
            document.getElementById('resources').innerHTML = RESOURCES.map(r =>
                '<span class="resource-item"><img src="/loomcompanywiki/img/' + r.sin + '.png"> ×' + r.count + '</span>'
            ).join('');
            document.getElementById('sinResists').innerHTML = SIN_RESISTS.map(r =>
                '<span class="resist-item"><img src="/loomcompanywiki/img/' + r.sin + '.png"> ' + r.value + '</span>'
            ).join('');

            document.getElementById('awakeCoin').textContent = AWAKE_COIN;
            document.getElementById('awakeSanity').textContent = AWAKE_SANITY;
            document.getElementById('awakeAttack').textContent = AWAKE_ATTACK;
            document.getElementById('awakeSkillImg').src = '/loomcompanywiki/img/' + AWAKE_SKILL_IMG;
            document.getElementById('awakeVoice').textContent = AWAKE_VOICE;
            const awakeDefault = AWAKE_STAGES[AWAKE_STAGES.length - 1];
            document.getElementById('awakeTabs').innerHTML = AWAKE_STAGES.map(s =>
                '<button class="stage-tab' + (s === awakeDefault ? ' active' : '') +
                '" onclick="switchAwakeStage(\'' + s + '\')">异想解析阶段' + s + '</button>'
            ).join('');
            document.getElementById('awakeDesc').innerHTML = parseStatusEffects(AWAKE_DESC[awakeDefault] || '');
            window.switchAwakeStage = function(stage) {
                document.getElementById('awakeDesc').innerHTML = parseStatusEffects(AWAKE_DESC[stage] || '');
                document.querySelectorAll('#awakeTabs .stage-tab').forEach(t => t.classList.remove('active'));
                const btn = Array.from(document.querySelectorAll('#awakeTabs .stage-tab')).find(t => t.textContent
                    .trim().startsWith(stage));
                if (btn) btn.classList.add('active');
            };

            document.getElementById('passiveName').textContent = PASSIVE_NAME;

            const passiveDefault = PASSIVE_STAGES[PASSIVE_STAGES.length - 1];
            let passiveTabsHTML = '';
            PASSIVE_STAGES.forEach(st => {
                passiveTabsHTML += '<button class="stage-tab' + (st === passiveDefault ? ' active' : '') +
                    '" onclick="switchPassiveStage(\'' + st + '\')">异想解析阶段' + st + '</button>';
            });
            document.getElementById('passiveEffect').innerHTML =
                '<div class="stage-tabs">' + passiveTabsHTML + '</div>' +
                '<span id="passiveEffectText">' + parseStatusEffects(PASSIVE_EFFECTS[passiveDefault] || '') + '</span>';

            window.switchPassiveStage = function(stage) {
                document.getElementById('passiveEffectText').innerHTML = parseStatusEffects(PASSIVE_EFFECTS[stage] ||
                    '');
                document.querySelectorAll('#passiveEffect .stage-tab').forEach(t => t.classList.remove('active'));
                const btn = Array.from(document.querySelectorAll('#passiveEffect .stage-tab')).find(t => t.textContent
                    .trim() === stage);
                if (btn) btn.classList.add('active');
            };
        </script>

        <script>
            fetch('/loomcompanywiki/nav.html')
                .then(res => res.text())
                .then(html => {
                    document.getElementById('nav-placeholder').innerHTML = html;
                    const current = document.querySelector('[data-nav="egos"]');
                    if (current) current.classList.add('active');
                });
        </script>

    </div>

</body>

</html>
