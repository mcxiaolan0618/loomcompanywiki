<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色介绍 - Loom Company 同人维基</title>
    <link rel="stylesheet" href="/loomcompanywiki/css/style.css">
    <style>
        .character-detail {
            max-width: 800px;
            margin: 0 auto;
            padding: 24px 16px;
        }
        .character-detail .back-link {
            display: inline-block;
            color: var(--gold);
            text-decoration: none;
            font-size: 1rem;
            margin-bottom: 16px;
            padding: 4px 12px;
            border: 1px solid var(--gold-dim);
            border-radius: 4px;
        }
        .character-detail .back-link:hover { background: rgba(201,166,92,0.1); }

        .detail-title {
            text-align: center;
            color: var(--gold);
            font-size: 2rem;
            letter-spacing: 3px;
            margin-bottom: 4px;
        }
        .detail-title-en {
            text-align: center;
            color: var(--text-dim);
            font-size: 1rem;
            letter-spacing: 2px;
            margin-bottom: 24px;
        }

        .info-card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .info-card h3 {
            color: var(--gold);
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        .info-card h4 {
            color: var(--gold-dim);
            font-size: 1rem;
            letter-spacing: 1px;
            margin: 12px 0 6px;
        }

        .info-table {
            width: 100%;
            font-size: 1rem;
        }
        .info-table td {
            padding: 4px 8px;
            vertical-align: top;
        }
        .info-table td:first-child {
            color: var(--gold-dim);
            font-weight: bold;
            white-space: nowrap;
            width: 80px;
        }
        .info-table td:last-child {
            color: var(--text-dim);
        }

        .char-description {
            color: var(--text-dim);
            font-size: 1rem;
            line-height: 1.7;
            white-space: pre-line;
        }

        .related-chars {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .related-char-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 14px;
            text-align: center;
            transition: all 0.2s;
            text-decoration: none;
            color: inherit;
            min-width: 100px;
        }
        .related-char-card:hover { border-color: var(--gold); }
        .related-char-card .char-role {
            font-size: 0.75rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }
        .related-char-card .char-name {
            font-size: 1rem;
            color: var(--gold);
            font-weight: bold;
            letter-spacing: 1px;
        }

        .spoiler-section { margin-top: 12px; }
        .spoiler-locked {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s;
        }
        .spoiler-locked:hover { border-color: #8b3a3a; }
        .spoiler-locked .warning-text {
            color: #d04a4a;
            font-weight: bold;
            font-size: 1rem;
            letter-spacing: 1px;
        }
        .spoiler-locked .hint-text {
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-top: 4px;
        }
        .spoiler-password {
            margin-top: 8px;
            display: flex;
            gap: 6px;
            justify-content: center;
        }
        .spoiler-password input {
            padding: 4px 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 3px;
            color: var(--text);
            font-size: 1rem;
            width: 100px;
            text-align: center;
            font-family: inherit;
        }
        .spoiler-password button {
            padding: 4px 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 3px;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.9rem;
            font-family: inherit;
        }
        .spoiler-password button:hover { border-color: var(--gold); color: var(--gold); }
        .spoiler-content {
            display: none;
            color: var(--text-dim);
            font-size: 1rem;
            line-height: 1.7;
            padding: 12px 0;
            white-space: pre-line;
        }
        .spoiler-content.unlocked { display: block; }
        .spoiler-error {
            color: #d04a4a;
            font-size: 0.8rem;
            margin-top: 4px;
            display: none;
        }

        .text-content {
            color: var(--text-dim);
            font-size: 1rem;
            line-height: 1.7;
            white-space: pre-line;
        }
    </style>
</head>
<body>

    <div id="nav-placeholder"></div>

    <div class="character-detail">
        <a href="/loomcompanywiki/employee/index.html" class="back-link">← 返回员工名单</a>

        <h1 class="detail-title" id="charNameCN"></h1>
        <div class="detail-title-en" id="charNameEN"></div>

        <div class="info-card">
            <h3>角色介绍</h3>
            <table class="info-table">
                <tr><td>性别</td><td id="charGender"></td></tr>
                <tr><td>身高</td><td id="charHeight"></td></tr>
                <tr><td>性格</td><td id="charPersonality"></td></tr>
                <tr><td>职业</td><td id="charJob"></td></tr>
                <tr><td>喜欢的东西</td><td id="charLike"></td></tr>
                <tr><td>讨厌的东西</td><td id="charDislike"></td></tr>
            </table>
        </div>

        <div class="info-card">
            <h3>角色介绍</h3>
            <div class="char-description" id="charDescription"></div>
        </div>

        <div class="info-card">
            <h3>相关角色</h3>
            <div class="related-chars" id="relatedChars"></div>
        </div>

        <div class="info-card">
            <h3>相关考据</h3>
            <h4>大致原出处</h4>
            <div class="text-content" id="originSource"></div>
            <h4>主要相关点</h4>
            <div class="text-content" id="originRelation"></div>
        </div>

        <div class="info-card">
            <h3>相关经历</h3>
            <div class="spoiler-section" id="spoilerSection"></div>
        </div>

    </div>

    <div class="footer">Loom Company 同人维基 · 此为一个镜世界中的故事</div>

    <script>
        /*
        ╔══════════════════════════════════════════╗
        ║  变量区 - 修改以下数值即可             ║
        ║  换行使用 \n                           ║
        ╚══════════════════════════════════════════╝
        */

        const CHAR_NAME_CN = '圣华·H·华生';
        const CHAR_NAME_EN = 'Stuart H. Watson';
        const CHAR_GENDER = '女';
        const CHAR_HEIGHT = '145cm';
        const CHAR_PERSONALITY = '好奇、慵懒、淡漠';
        const CHAR_JOB = '织机公司回收部门4号员工';
        const CHAR_LIKE = '汉堡，手办，模型，偶像';
        const CHAR_DISLIKE = '虫子，水生动物';

        const CHAR_DESCRIPTION = '姓名：圣华·H·华生 04\n职位：调查员、侦探/员工\n出身地：7区\n性别：女\n某人的留言：出身于R巢某武器工坊的孩子，她拥有难以置信的力量。妥善处理她。\n主管记录：目前可以说的是，十分擅长收集情报，也很擅长推理。但因为其摆烂的性格，沟通方面有点困难，该员工唯一的兴趣就是观察“死亡”。\n［注意］不要让人触碰她';

        const RELATED_CHARS = [
            // { role: '职业/关系', name: '角色名', url: 'xxx.html' },
        ];

        const ORIGIN_SOURCE = '《福尔摩斯探案集》出自英国作家阿瑟·柯南·道尔爵士于1887年至1927年间发表的一系列侦探小说，共包含4部长篇与56部短篇，被公认为推理文学的不朽丰碑。\n该作讲述天才侦探夏洛克·福尔摩斯与其挚友兼记录者华生医生同居于伦敦贝克街221B号，凭借惊人的观察力、广博的化学与解剖学知识以及严谨的逻辑演绎，屡屡破解苏格兰场束手无策的奇案。福尔摩斯穿梭于雾都的暗巷与乡间古堡，在波西米亚丑闻、巴斯克维尔猎犬、红发会、最后一案等经典案件中，以理性之光照亮人性的幽暗角落。他曾在莱辛巴赫瀑布与莫里亚蒂教授同归于尽又奇迹生还，晚年退隐于萨塞克斯郡养蜂，留下“排除所有不可能，剩下的即使再不可思议，也必然是真相”的黄金法则，成为文学史上永恒的侦探化身。';
        const ORIGIN_RELATION = '圣华·H·华生，其姓氏“华生”直接指向约翰·H·华生医生——福尔摩斯一生的挚友与案件记录者。\n\n「那一日...」对应《福尔摩斯探案集》中「最后一案」（The Final Problem）——福尔摩斯与莫里亚蒂教授在莱辛巴赫瀑布的搏斗，两人双双坠入深渊，福尔摩斯就此“死去”，华生医生在悲痛中写下这段记录的终章。';

        const SPOILER_LOCKED = true;
        const SPOILER_PASSWORD = '006618';
        const SPOILER_CONTENT = '圣华所在的家族是一个想要成为翼的家族，主要是工坊以及生物兵器方面，她的姐姐不喜欢她。\n圣华的母亲想要将一个研究了很久的生物植入她的身体里，但是华生肯定是不会同意的，然后有一天，突然发现一场导致圣华严重受伤的事件，为了给她续命，只能将那个兵器植入她的体内\n她有个很要好的信友，因为信友不见了，所以加入了Seven协会，想要找到与他相关的情报';
        
        /*樋口圣华
LCR-4号员工
调查员/员工
对应罪种：怠惰
故事本身对应着卡巴拉之树的Netzath（生存下去的勇气+卡巴拉之树的这个质点本来的含义）
备注：只是整个剧情关联着这个质点（不要在剧情内提到这个质点/也不要提及获得ego的方式）
4.该角色背景：七协会收尾人/女
上学，为了考到一个好成绩，一个好工作，来到了翼工作，却发现，自己没有自身的方向，随后认识了一个网友
那个网友（安东），与她（圣华）的情况差不多，只不过她是对生的怠惰。
对这个都市感到无趣，对没有目标的自己感到无趣，但对死亡感兴趣。
虽然稍微好转了一阵子，但不知为何，网友开始疏离，甚至之后无法联系到了
于是加入了七协会这个收集情报的协会，想着有没有什么时候会见面
被自己的亲属送了一份礼物，耶梦加得，它可以吃掉它认为属于烦恼的记忆，所以圣华的记忆其实已经不能说是健全了
她会蜕四次皮（包装纸！？）
条件：对失去的痛苦，对自我的恐惧，外界死亡的威胁，对神的仇恨
没有意外的话，蜕皮时间点 （圣华前篇/主线中篇/圣华后篇）

圣华前篇的故事与其的家族有关，那个家族所制造的生物兵器，已经成了都市梦魇，我们与一个组织接下了这个委托...
圣华后篇的故事，是围绕圣华所在的家族的故事
正常情况下，圣华不会蜕第四次皮，而她所代表的耶梦加得在某些条件下，选择正确会使终章不需要与其战斗
她也代表着 索尔，她有概率与所有世界的主管立下赌注，她会投身于冥河之中...

        /*
        ╔══════════════════════════════════════════╗
        ║  渲染逻辑                               ║
        ╚══════════════════════════════════════════╝
        */

        document.getElementById('charNameCN').textContent = CHAR_NAME_CN;
        document.getElementById('charNameEN').textContent = CHAR_NAME_EN;
        document.getElementById('charGender').textContent = CHAR_GENDER;
        document.getElementById('charHeight').textContent = CHAR_HEIGHT;
        document.getElementById('charPersonality').textContent = CHAR_PERSONALITY;
        document.getElementById('charJob').textContent = CHAR_JOB;
        document.getElementById('charLike').textContent = CHAR_LIKE;
        document.getElementById('charDislike').textContent = CHAR_DISLIKE;
        document.getElementById('charDescription').textContent = CHAR_DESCRIPTION;

        if (RELATED_CHARS.length === 0) {
            document.getElementById('relatedChars').innerHTML = '<span class="text-content">暂无</span>';
        } else {
            document.getElementById('relatedChars').innerHTML = RELATED_CHARS.map(c =>
                '<a href="' + c.url + '" class="related-char-card">' +
                '<div class="char-role">' + c.role + '</div>' +
                '<div class="char-name">' + c.name + '</div>' +
                '</a>'
            ).join('');
        }

        document.getElementById('originSource').textContent = ORIGIN_SOURCE;
        document.getElementById('originRelation').textContent = ORIGIN_RELATION;

        const spoilerSection = document.getElementById('spoilerSection');
        if (SPOILER_LOCKED) {
            spoilerSection.innerHTML = `
                <div class="spoiler-locked" id="spoilerLocked">
                    <div class="warning-text">⚠Warning⚠ 权限不足 无法访问 ⚠Warning⚠</div>
                    <div class="hint-text">输入密码：006618 即可访问</div>
                    <div class="spoiler-password">
                        <input type="password" id="spoilerInput" placeholder="密码">
                        <button onclick="unlockSpoiler()">确认</button>
                    </div>
                    <div class="spoiler-error" id="spoilerError">密码错误</div>
                </div>
                <div class="spoiler-content" id="spoilerContent">${SPOILER_CONTENT}</div>
            `;

            window.unlockSpoiler = function() {
                const input = document.getElementById('spoilerInput').value;
                if (input === SPOILER_PASSWORD) {
                    document.getElementById('spoilerLocked').style.display = 'none';
                    document.getElementById('spoilerContent').classList.add('unlocked');
                } else {
                    document.getElementById('spoilerError').style.display = 'block';
                }
            };
        } else {
            spoilerSection.innerHTML = '<div class="text-content">' + SPOILER_CONTENT + '</div>';
        }
    </script>

    <script>
        fetch('/loomcompanywiki/nav.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('nav-placeholder').innerHTML = html;
                const current = document.querySelector('[data-nav="employee"]');
                if (current) current.classList.add('active');
            });
    </script>

</body>
</html>
