<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色介绍 - Loom Company 同人维基</title>
    <link rel="stylesheet" href="/loomcompanywiki/css/style.css">
    <style>
        .character-detail {
            max-width: 800px;
            margin: 0 auto;
            padding: 24px 16px;
        }
        .character-detail .back-link {
            display: inline-block;
            color: var(--gold);
            text-decoration: none;
            font-size: 1rem;
            margin-bottom: 16px;
            padding: 4px 12px;
            border: 1px solid var(--gold-dim);
            border-radius: 4px;
        }
        .character-detail .back-link:hover { background: rgba(201,166,92,0.1); }

        .detail-title {
            text-align: center;
            color: var(--gold);
            font-size: 2rem;
            letter-spacing: 3px;
            margin-bottom: 4px;
        }
        .detail-title-en {
            text-align: center;
            color: var(--text-dim);
            font-size: 1rem;
            letter-spacing: 2px;
            margin-bottom: 24px;
        }

        .info-card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .info-card h3 {
            color: var(--gold);
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        .info-card h4 {
            color: var(--gold-dim);
            font-size: 1rem;
            letter-spacing: 1px;
            margin: 12px 0 6px;
        }

        .info-table {
            width: 100%;
            font-size: 1rem;
        }
        .info-table td {
            padding: 4px 8px;
            vertical-align: top;
        }
        .info-table td:first-child {
            color: var(--gold-dim);
            font-weight: bold;
            white-space: nowrap;
            width: 80px;
        }
        .info-table td:last-child {
            color: var(--text-dim);
        }

        .char-description {
            color: var(--text-dim);
            font-size: 1rem;
            line-height: 1.7;
            white-space: pre-line;
        }

        .related-chars {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .related-char-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 14px;
            text-align: center;
            transition: all 0.2s;
            text-decoration: none;
            color: inherit;
            min-width: 100px;
        }
        .related-char-card:hover { border-color: var(--gold); }
        .related-char-card .char-role {
            font-size: 0.75rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }
        .related-char-card .char-name {
            font-size: 1rem;
            color: var(--gold);
            font-weight: bold;
            letter-spacing: 1px;
        }

        .spoiler-section { margin-top: 12px; }
        .spoiler-locked {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s;
        }
        .spoiler-locked:hover { border-color: #8b3a3a; }
        .spoiler-locked .warning-text {
            color: #d04a4a;
            font-weight: bold;
            font-size: 1rem;
            letter-spacing: 1px;
        }
        .spoiler-locked .hint-text {
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-top: 4px;
        }
        .spoiler-password {
            margin-top: 8px;
            display: flex;
            gap: 6px;
            justify-content: center;
        }
        .spoiler-password input {
            padding: 4px 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 3px;
            color: var(--text);
            font-size: 1rem;
            width: 100px;
            text-align: center;
            font-family: inherit;
        }
        .spoiler-password button {
            padding: 4px 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 3px;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.9rem;
            font-family: inherit;
        }
        .spoiler-password button:hover { border-color: var(--gold); color: var(--gold); }
        .spoiler-content {
            display: none;
            color: var(--text-dim);
            font-size: 1rem;
            line-height: 1.7;
            padding: 12px 0;
            white-space: pre-line;
        }
        .spoiler-content.unlocked { display: block; }
        .spoiler-error {
            color: #d04a4a;
            font-size: 0.8rem;
            margin-top: 4px;
            display: none;
        }

        .text-content {
            color: var(--text-dim);
            font-size: 1rem;
            line-height: 1.7;
            white-space: pre-line;
        }
    </style>
</head>
<body>

    <div id="nav-placeholder"></div>

    <div class="character-detail">

                <tr><td>讨厌的东西</td><td id="charDislike"></td></tr>

        <div class="info-card">

        const SPOILER_LOCKED = true;
        const SPOILER_PASSWORD = '006618';
        const SPOILER_CONTENT = '阿里\nLCR-9号员工\n战略副手/员工\n对应罪种：忧郁\n故事本身对应着卡巴拉之树的（拥抱过去，创造未来+卡巴拉之树的这个质点本来的含义）\n只是整个剧情关联着这个质点（不要在剧情内提到这个质点/也不要提及获得ego的方式）\n4.该角色背景：食指传令员/女\n在得知了食指的指令是由都市之意发出的，然后发现。/*在游戏中，阿里与上校相似，都曾被某种高于自身的意志所支配，无法挣脱。也同样在漫长而疲惫的挣扎之后，以一次彻底的“违背”宣告了自身的独立，却也因此失去了曾经庇护她的秩序，陷入了更彻底的漂泊与空虚之中。'
        /*由于命运或某种更高意志的安排，本该因此死去的她被一条新的指令所接住，被引导至某个陌生的组织。于是她没有死成，也不被允许真正地活过，只是像一件用旧了的东西那样被从战场转移到了另一个地方。
后篇是拥抱过去，同时在主线中代表了 瓦利，而若麦 会因为流向 误杀 莉莉娅（如果第三章存活），而阿里 会根据流向，向其复仇

· 关键词： 混乱、幻觉、疯狂、非理性、扭曲的欲望

后篇 第十四章 （不一定是这一章）
质点：智慧-拥抱过去，创造未来

性格：
对话：

布恩迪亚家，食指相关家族
· 布恩迪亚家族次女，出生时被指令选中

        */

        document.getElementById('charNameCN').textContent = CHAR_NAME_CN;
        document.getElementById('charNameEN').textContent = CHAR_NAME_EN;
        document.getElementById('charGender').textContent = CHAR_GENDER;
        document.getElementById('charHeight').textContent = CHAR_HEIGHT;
        document.getElementById('charPersonality').textContent = CHAR_PERSONALITY;
        document.getElementById('charJob').textContent = CHAR_JOB;
        document.getElementById('charLike').textContent = CHAR_LIKE;
        document.getElementById('charDislike').textContent = CHAR_DISLIKE;
        document.getElementById('charDescription').textContent = CHAR_DESCRIPTION;

        if (RELATED_CHARS.length === 0) {
            document.getElementById('relatedChars').innerHTML = '<span class="text-content">暂无</span>';
        } else {
            document.getElementById('relatedChars').innerHTML = RELATED_CHARS.map(c =>
                '<a href="' + c.url + '" class="related-char-card">' +
                '<div class="char-role">' + c.role + '</div>' +
                '<div class="char-name">' + c.name + '</div>' +
                '</a>'
            ).join('');
        }

        document.getElementById('originSource').textContent = ORIGIN_SOURCE;
        document.getElementById('originRelation').textContent = ORIGIN_RELATION;

        const spoilerSection = document.getElementById('spoilerSection');
        if (SPOILER_LOCKED) {
            spoilerSection.innerHTML = `
                <div class="spoiler-locked" id="spoilerLocked">
                    <div class="warning-text">⚠Warning⚠ 权限不足 无法访问 ⚠Warning⚠</div>
                    <div class="hint-text">请输入代码以获得权限</div>
                    <div class="spoiler-password">
                        <input type="password" id="spoilerInput" placeholder="密码">
                        <button onclick="unlockSpoiler()">确认</button>
                    </div>
                    <div class="spoiler-error" id="spoilerError">密码错误</div>
                </div>
                <div class="spoiler-content" id="spoilerContent">${SPOILER_CONTENT}</div>
            `;

            window.unlockSpoiler = function() {
                const input = document.getElementById('spoilerInput').value;
                if (input === SPOILER_PASSWORD) {
                    document.getElementById('spoilerLocked').style.display = 'none';
                    document.getElementById('spoilerContent').classList.add('unlocked');
                } else {
                    document.getElementById('spoilerError').style.display = 'block';
                }
            };
        } else {
            spoilerSection.innerHTML = '<div class="text-content">' + SPOILER_CONTENT + '</div>';

        fetch('/loomcompanywiki/nav.html')
            .then(res => res.text())

                document.getElementById('nav-placeholder').innerHTML = html;
                const current = document.querySelector('[data-nav="employee"]');
                if (current) current.classList.add('active');
            });
    </script>
