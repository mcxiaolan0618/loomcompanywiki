<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色介绍 - Loom Company 同人维基</title>
    <link rel="stylesheet" href="/loomcompanywiki/css/style.css">
    <style>
        .character-detail {
            max-width: 800px;
            margin: 0 auto;
            padding: 24px 16px;
        }
        .character-detail .back-link {
            display: inline-block;
            color: var(--gold);
            text-decoration: none;
            font-size: 0.85rem;
            margin-bottom: 16px;
            padding: 4px 12px;
            border: 1px solid var(--gold-dim);
            border-radius: 4px;
        }
        .character-detail .back-link:hover { background: rgba(201,166,92,0.1); }

        .detail-title {
            text-align: center;
            color: var(--gold);
            font-size: 2rem;
            letter-spacing: 3px;
            margin-bottom: 4px;
        }
        .detail-title-en {
            text-align: center;
            color: var(--text-dim);
            font-size: 1rem;
            letter-spacing: 2px;
            margin-bottom: 24px;
        }

        .info-card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .info-card h3 {
            color: var(--gold);
            font-size: 1rem;
            letter-spacing: 2px;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        .info-card h4 {
            color: var(--gold-dim);
            font-size: 0.9rem;
            letter-spacing: 1px;
            margin: 12px 0 6px;
        }

        .info-table {
            width: 100%;
            font-size: 0.85rem;
        }
        .info-table td {
            padding: 4px 8px;
            vertical-align: top;
        }
        .info-table td:first-child {
            color: var(--gold-dim);
            font-weight: bold;
            white-space: nowrap;
            width: 80px;
        }
        .info-table td:last-child {
            color: var(--text-dim);
        }

        .char-description {
            color: var(--text-dim);
            font-size: 0.9rem;
            line-height: 1.7;
            white-space:pre-line
        }

        .related-chars {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .related-char-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 14px;
            text-align: center;
            transition: all 0.2s;
            text-decoration: none;
            color: inherit;
            min-width: 100px;
        }
        .related-char-card:hover { border-color: var(--gold); }
        .related-char-card .char-role {
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }
        .related-char-card .char-name {
            font-size: 0.85rem;
            color: var(--gold);
            font-weight: bold;
            letter-spacing: 1px;
        }

        .spoiler-toggle {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s;
            margin-bottom: 8px;
        }
        .spoiler-toggle:hover { border-color: #8b3a3a; }
        .spoiler-toggle .warning-text {
            color: #d04a4a;
            font-weight: bold;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }
        .spoiler-content {
            display: none;
            color: var(--text-dim);
            font-size: 0.85rem;
            line-height: 1.7;
        }
        .spoiler-content.show { display: block; }

        .spoiler-locked {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s;
        }
        .spoiler-locked:hover { border-color: #8b3a3a; }
        .spoiler-locked .warning-text {
            color: #d04a4a;
            font-weight: bold;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
        .spoiler-locked .hint-text {
            color: var(--text-dim);
            font-size: 0.7rem;
            margin-top: 4px;
        }
        .spoiler-password {
            margin-top: 8px;
            display: flex;
            gap: 6px;
            justify-content: center;
        }
        .spoiler-password input {
            padding: 4px 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 3px;
            color: var(--text);
            font-size: 0.8rem;
            width: 100px;
            text-align: center;
            font-family: inherit;
        }
        .spoiler-password button {
            padding: 4px 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 3px;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.75rem;
            font-family: inherit;
        }
        .spoiler-password button:hover { border-color: var(--gold); color: var(--gold); }
        .spoiler-error {
            color: #d04a4a;
            font-size: 0.7rem;
            margin-top: 4px;
            display: none;
        }

        .text-content {
            color: var(--text-dim);
            font-size: 0.85rem;
            line-height: 1.7;
            white-space:pre-line
        }
    </style>
</head>
<body>

    <div id="nav-placeholder"></div>

    <div class="character-detail">
        <a href="/loomcompanywiki/employee/index.html" class="back-link">← 返回员工名单</a>

        <!-- 名字 -->
        <h1 class="detail-title" id="charNameCN"></h1>
        <div class="detail-title-en" id="charNameEN"></div>

        <!-- 基本信息表 -->
        <div class="info-card">
            <table class="info-table">
                <tr><td>性别</td><td id="charGender"></td></tr>
                <tr><td>身高</td><td id="charHeight"></td></tr>
                <tr><td>性格</td><td id="charPersonality"></td></tr>
                <tr><td>职业</td><td id="charJob"></td></tr>
                <tr><td>喜欢的东西</td><td id="charLike"></td></tr>
                <tr><td>讨厌的东西</td><td id="charDislike"></td></tr>
            </table>
        </div>

        <!-- 角色介绍 -->
        <div class="info-card">
            <h3>角色介绍</h3>
            <div class="char-description" id="charDescription"></div>
        </div>

        <!-- 相关角色 -->
        <div class="info-card">
            <h3>相关角色</h3>
            <div class="related-chars" id="relatedChars"></div>
        </div>

        <!-- 相关考据 -->
        <div class="info-card">
            <h3>相关考据</h3>
            <h4>大致原出处</h4>
            <div class="text-content" id="originSource"></div>
            <h4>主要相关点</h4>
            <div class="text-content" id="originRelation"></div>
        </div>

        <!-- 相关经历 -->
        <div class="info-card">
            <h3>相关经历</h3>
            <div class="spoiler-section" id="spoilerSection"></div>
        </div>

    </div>

    <div class="footer">Loom Company 同人维基 · 此为一个镜世界中的故事</div>

    <script>
        /*
        ╔══════════════════════════════════════════╗
        ║  变量区 - 修改以下数值即可             ║
        ╚══════════════════════════════════════════╝
        */

        // ===== 基本信息 =====
        const CHAR_NAME_CN = '特瑞斯·里普利';
        const CHAR_NAME_EN = 'Therese Ripley';
        const CHAR_GENDER = '女';
        const CHAR_HEIGHT = '178cm';
        const CHAR_PERSONALITY = '开朗，偏执，处事圆滑';
        const CHAR_JOB = '织机公司回收部门11号员工';
        const CHAR_LIKE = '猫，游戏，钢笔，黑咖啡';
        const CHAR_DISLIKE = '没道德的人/牛头人/被监听/上流社会的礼仪（阶级礼仪）';

        // ===== 角色介绍 =====
        const CHAR_DESCRIPTION = '表面开朗圆滑、实则十分警觉，一旦触及底线便会展现出极度偏执与疯狂的人。\n特瑞斯·里普利 11\n职位:情报官\n某人的留言:与该员工相处时,请不要做出会踩中她雷点的行为(包括背叛、欺骗、利用职权欺压，以及拿她亲近之人威胁)\n她应该是你领导的员工之中最积极的人了吧,但请注意维护这段关系\n[注意]请注意不要让该员工与拇指进行接触\n[■■■]她并不是命定之人';

        // ===== 相关角色 =====
        const RELATED_CHARS = [
            // { role: '职业/关系', name: '角色名', url: '../character/xxx.html' },
        ];

        // ===== 相关考据 =====
        const ORIGIN_SOURCE= '特瑞斯·里普利《盐的代价》与《天才雷普利》出自美国作家帕特里夏·海史密斯之手，分别发表于1952年与1955年，被公认为心理犯罪与禁忌情感文学的经典之作。\n《盐的代价》讲述19岁的售货员特芮丝与正在离婚的贵妇卡罗尔在公路旅行中相爱，却因卡罗尔丈夫的窃听与抚养权要挟被迫分离，特芮丝因此陷入极度的痛苦。/n《天才雷普利》则讲述穷困潦倒的汤姆·雷普利受雇前往意大利劝说富家子弟迪基回国，因嫉妒与虚荣杀死了迪基，并凭借天才般的伪造与伪装技巧冒名顶替了他的身份，在无尽的谎言中抹去了真实的自己。';
        const ORIGIN_RELATION= '特芮丝·里普利的名字直接对应了海史密斯笔下的两个核心人物。\n“特芮丝”对应《盐的代价》中那个19岁、迷茫却对卡罗尔抱有飞蛾扑火般执念的售货员，这代表了她内心深处唯一保留的真实与炽热的爱；\n“里普利”则对应《天才雷普利》中那个极度渴望阶级跨越、凭借天才般的伪造与杀戮顶替他人身份的天才骗子，这代表了她在这个残酷都市中所披上的冷酷伪装与生存手段。';

        // ===== 相关经历 =====
        const SPOILER_MODE = 'locked';
        const SPOILER_PASSWORD = '006618';
        const SPOILER_CONTEN = '';

/* 这部分先注释掉
特芮丝·雷普利19岁，在U巢的百货公司玩具专柜做临时工，梦想是舞台设计师。ta在后巷的生活，使其擅长模仿别人的字迹，声音与动作，甚至伪造文件。她有个索然无味的男友（？）理查德，生活迷茫。
某天，造船大亨格林利夫先生找到了ta（因为在格林利夫看来，年轻、不起眼、擅长模仿笔迹和声音的特芮丝，是去拇指劝他儿子退出拇指的完美人选）。为了钱，特芮丝接下了这个委托。去专柜交接工作时，她遇到了来买娃娃的卡罗尔，两人一见如故。
特瑞斯动身前往拇指，找到富家子弟迪基。她被迪基奢靡的生活深深吸引，甚至开始模仿迪基的做派。然而迪基厌倦了她，在一次游艇冲突中，特芮丝在嫉妒与疯狂中杀死了迪基，并凭借高超的伪装技巧，盗用迪基的身份，继续挥霍他的财产。
在意大利假冒迪基的这段时间，特瑞斯与留在U巢的卡罗尔保持着书信往来。卡罗尔以为特芮丝只是个在异国打工的普通女孩。当卡罗尔决定进行公路旅行时，特芮丝带着迪基的钱和伪造的身份回到了美国，与卡罗尔踏上了旅途。

特瑞斯和卡罗尔的公路旅行充满激情，她终于找到了真正的自我。然而，卡罗尔的丈夫哈吉雇佣私家侦探一路跟踪，录下了她们的证据，并以丑闻要挟争夺女儿抚养权。
与此同时（缝《列车上的陌生人》）： 卡罗尔此时已经被逼入绝境。在绝望中，她在火车上（或某次偶然中）遇到了一个陌生人，达成了一场“交换谋杀”的协议——陌生人帮她解决丈夫哈吉的勒索问题，而卡罗尔需要提供一样东西作为交换。
卡罗尔为了保护特瑞斯，也为了摆脱丈夫，被迫与特瑞斯切断联系（《盐的代价》原作剧情）。
另一边，特芮丝在拇指的“迪基案”也开始败露，拇指高层开始追查迪基的下落。

两人被迫分离。卡罗尔回到了女儿身边，但那个“交换协议”真的发生了，她的丈夫死于一场意外，卡罗尔成了最大的嫌疑人，或至少成了这场共谋的知情者。她背负着这个致命的秘密，活得如履薄冰。
特瑞斯则利用她的天才伪装技巧，伪造了自己的死亡或新身份，躲过了拇指追查。这8年里，她成了一个彻底的“伪装者”，穿梭在都市的阴影里，为了生存和寻找卡罗尔的线索，加入了织机公司。
这8年里，她们都知道对方还活着，但谁都不敢联系谁，因为双方的过去只要见光，就会让两人同时毁灭。

*/

        /*
        ╔══════════════════════════════════════════╗
        ║  渲染逻辑                               ║
        ╚══════════════════════════════════════════╝
        */

        document.getElementById('charNameCN').textContent = CHAR_NAME_CN;
        document.getElementById('charNameEN').textContent = CHAR_NAME_EN;
        document.getElementById('charGender').textContent = CHAR_GENDER;
        document.getElementById('charHeight').textContent = CHAR_HEIGHT;
        document.getElementById('charPersonality').textContent = CHAR_PERSONALITY;
        document.getElementById('charJob').textContent = CHAR_JOB;
        document.getElementById('charLike').textContent = CHAR_LIKE;
        document.getElementById('charDislike').textContent = CHAR_DISLIKE;
        document.getElementById('charDescription').textContent = CHAR_DESCRIPTION;

        // 相关角色
        if (RELATED_CHARS.length === 0) {
            document.getElementById('relatedChars').innerHTML = '<span class="text-content">暂无</span>';
        } else {
            document.getElementById('relatedChars').innerHTML = RELATED_CHARS.map(c =>
                '<a href="' + c.url + '" class="related-char-card">' +
                '<div class="char-role">' + c.role + '</div>' +
                '<div class="char-name">' + c.name + '</div>' +
                '</a>'
            ).join('');
        }

        // 考据
        document.getElementById('originSource').textContent = ORIGIN_SOURCE;
        document.getElementById('originRelation').textContent = ORIGIN_RELATION;

        // 剧透
        const spoilerSection = document.getElementById('spoilerSection');
        if (SPOILER_MODE === 'locked') {
            spoilerSection.innerHTML = `
                <div class="spoiler-locked" id="spoilerLocked">
                    <div class="warning-text">⚠Warning⚠ 权限不足 无法访问 ⚠Warning⚠</div>
                    <div class="hint-text">请输入代码以获得权限</div>
                    <div class="spoiler-password">
                        <input type="password" id="spoilerInput" placeholder="密码">
                        <button onclick="unlockSpoiler()">确认</button>
                    </div>
                    <div class="spoiler-error" id="spoilerError">密码错误</div>
                </div>
                <div class="spoiler-content" id="spoilerContent">${SPOILER_CONTENT}</div>
            `;
            window.unlockSpoiler = function() {
                const input = document.getElementById('spoilerInput').value;
                if (input === SPOILER_PASSWORD) {
                    document.getElementById('spoilerLocked').style.display = 'none';
                    document.getElementById('spoilerContent').classList.add('show');
                } else {
                    document.getElementById('spoilerError').style.display = 'block';
                }
            };
        } else if (SPOILER_MODE === 'click') {
            spoilerSection.innerHTML = `
                <div class="spoiler-toggle" id="spoilerToggle" onclick="toggleSpoiler()">
                    <div class="warning-text">⚠Warning⚠ 此部分涉及剧透 ⚠Warning⚠</div>
                    <div class="hint-text">（单击一次以展开内容）</div>
                </div>
                <div class="spoiler-content" id="spoilerContent">${SPOILER_CONTENT}</div>
            `;
            window.toggleSpoiler = function() {
                document.getElementById('spoilerContent').classList.toggle('show');
                const toggle = document.getElementById('spoilerToggle');
                if (document.getElementById('spoilerContent').classList.contains('show')) {
                    toggle.querySelector('.hint-text').textContent = '（单击一次以收起内容）';
                } else {
                    toggle.querySelector('.hint-text').textContent = '（单击一次以展开内容）';
                }
            };
        } else {
            spoilerSection.innerHTML = '<div class="text-content">' + SPOILER_CONTENT + '</div>';
        }
    </script>

    <script>
        fetch('/loomcompanywiki/nav.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('nav-placeholder').innerHTML = html;
                const current = document.querySelector('[data-nav="employee"]');
                if (current) current.classList.add('active');
            });
    </script>

</body>
</html>
