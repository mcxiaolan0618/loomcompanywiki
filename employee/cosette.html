<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色介绍 - Loom Company 同人维基</title>
    <link rel="stylesheet" href="/loomcompanywiki/css/style.css">
    <style>
        .character-detail {
            max-width: 800px;
            margin: 0 auto;
            padding: 24px 16px;
        }
        .character-detail .back-link {
            display: inline-block;
            color: var(--gold);
            text-decoration: none;
            font-size: 1rem;
            margin-bottom: 16px;
            padding: 4px 12px;
            border: 1px solid var(--gold-dim);
            border-radius: 4px;
        }
        .character-detail .back-link:hover { background: rgba(201,166,92,0.1); }

        .detail-title {
            text-align: center;
            color: var(--gold);
            font-size: 2rem;
            letter-spacing: 3px;
            margin-bottom: 4px;
        }
        .detail-title-en {
            text-align: center;
            color: var(--text-dim);
            font-size: 1rem;
            letter-spacing: 2px;
            margin-bottom: 24px;
        }

        .info-card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .info-card h3 {
            color: var(--gold);
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        .info-card h4 {
            color: var(--gold-dim);
            font-size: 1rem;
            letter-spacing: 1px;
            margin: 12px 0 6px;
        }

        .info-table {
            width: 100%;
            font-size: 1rem;
        }
        .info-table td {
            padding: 4px 8px;
            vertical-align: top;
        }
        .info-table td:first-child {
            color: var(--gold-dim);
            font-weight: bold;
            white-space: nowrap;
            width: 80px;
        }
        .info-table td:last-child {
            color: var(--text-dim);
        }

        .char-description {
            color: var(--text-dim);
            font-size: 1rem;
            line-height: 1.7;
            white-space: pre-line;
        }

        .related-chars {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .related-char-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 14px;
            text-align: center;
            transition: all 0.2s;
            text-decoration: none;
            color: inherit;
            min-width: 100px;
        }
        .related-char-card:hover { border-color: var(--gold); }
        .related-char-card .char-role {
            font-size: 0.75rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }
        .related-char-card .char-name {
            font-size: 1rem;
            color: var(--gold);
            font-weight: bold;
            letter-spacing: 1px;
        }

        .spoiler-section { margin-top: 12px; }
        .spoiler-locked {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s;
        }
        .spoiler-locked:hover { border-color: #8b3a3a; }
        .spoiler-locked .warning-text {
            color: #d04a4a;
            font-weight: bold;
            font-size: 1rem;
            letter-spacing: 1px;
        }
        .spoiler-locked .hint-text {
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-top: 4px;
        }
        .spoiler-password {
            margin-top: 8px;
            display: flex;
            gap: 6px;
            justify-content: center;
        }
        .spoiler-password input {
            padding: 4px 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 3px;
            color: var(--text);
            font-size: 1rem;
            width: 100px;
            text-align: center;
            font-family: inherit;
        }
        .spoiler-password button {
            padding: 4px 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 3px;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.9rem;
            font-family: inherit;
        }
        .spoiler-password button:hover { border-color: var(--gold); color: var(--gold); }
        .spoiler-content {
            display: none;
            color: var(--text-dim);
            font-size: 1rem;
            line-height: 1.7;
            padding: 12px 0;
            white-space: pre-line;
        }
        .spoiler-content.unlocked { display: block; }
        .spoiler-error {
            color: #d04a4a;
            font-size: 0.8rem;
            margin-top: 4px;
            display: none;
        }

        .text-content {
            color: var(--text-dim);
            font-size: 1rem;
            line-height: 1.7;
            white-space: pre-line;
        }
    </style>
</head>
<body>

    <div id="nav-placeholder"></div>

    <div class="character-detail">
        <a href="/loomcompanywiki/employee/index.html" class="back-link">← 返回员工名单</a>

        <h1 class="detail-title" id="charNameCN"></h1>
        <div class="detail-title-en" id="charNameEN"></div>

        <div class="info-card">
            <h3>角色介绍</h3>
            <table class="info-table">
                <tr><td>性别</td><td id="charGender"></td></tr>
                <tr><td>身高</td><td id="charHeight"></td></tr>
                <tr><td>性格</td><td id="charPersonality"></td></tr>
                <tr><td>职业</td><td id="charJob"></td></tr>
                <tr><td>喜欢的东西</td><td id="charLike"></td></tr>
                <tr><td>讨厌的东西</td><td id="charDislike"></td></tr>
            </table>
        </div>

        <div class="info-card">
            <h3>角色介绍</h3>
            <div class="char-description" id="charDescription"></div>
        </div>

        <div class="info-card">
            <h3>相关角色</h3>
            <div class="related-chars" id="relatedChars"></div>
        </div>

        <div class="info-card">
            <h3>相关考据</h3>
            <h4>大致原出处</h4>
            <div class="text-content" id="originSource"></div>
            <h4>主要相关点</h4>
            <div class="text-content" id="originRelation"></div>
        </div>

        <div class="info-card">
            <h3>相关经历</h3>
            <div class="spoiler-section" id="spoilerSection"></div>
        </div>

    </div>

    <div class="footer">Loom Company 同人维基 · 此为一个镜世界中的故事</div>

    <script>
        /*
        ╔══════════════════════════════════════════╗
        ║  变量区 - 修改以下数值即可             ║
        ║  换行使用 \n                           ║
        ╚══════════════════════════════════════════╝
        */

        const CHAR_NAME_CN = '欧福拉吉·珂赛特·割风';
        const CHAR_NAME_EN = 'Euphrasie Cosette Fauchelevent';
        const CHAR_GENDER = '女';
        const CHAR_HEIGHT = '170cm';
        const CHAR_PERSONALITY = '坚韧、纯洁、感恩';
        const CHAR_JOB = '织机公司回收部门11号员工';
        const CHAR_LIKE = '清晨的阳光，散步，阅读，温馨的环境';
        const CHAR_DISLIKE = '暴力，孤独，被视作物品，黑暗狭小的空间';

        const CHAR_DESCRIPTION = '姓名：珂赛特 11\n职位：员工\n出身地：14区\n性别：女\n某人的留言：因为她与其他人所签署的合同完全不同，她对于我司并不是“十分重要”的员工，但这也并非说明你不需要去观察其的动向。\n主管记录：沉默寡言，习惯将自己放在不显眼的位置。工作中极少主动发言，但被问及时会给出精准而克制的回答。她对“被注视”有本能的紧张感，尤其是当视线集中在她的后颈或手腕时——这些细节没有被写入任何正式记录，但观察足够仔细的人都能察觉到。体力层面不如其他员工，但耐力极佳，能够承受长时间的高强度工作而不表露疲惫。她似乎很擅长忍受疼痛，几乎可以说是对于疼痛不会做出任何表情。';

        const RELATED_CHARS = [
            // { role: '职业/关系', name: '角色名', url: 'xxx.html' },
        ];

        const ORIGIN_SOURCE = '珂赛特出自法国作家雨果1862年出版的长篇小说《悲惨世界》，是十九世纪人道主义文学的丰碑之作。\n该作讲述苦役犯冉阿让因偷一块面包被判十九年徒刑，出狱后受主教感化洗心革面，化名马德兰成为市长，却始终被警长沙威追捕。他收养了孤女珂赛特，在巴黎街垒战的硝烟中救下革命青年马吕斯，最终在珂赛特的幸福中安详离世。小说以法国大革命后的动荡社会为背景，在冉阿让一生的逃亡与救赎中，追问了法律与仁慈、正义与宽恕的永恒命题。';
        const ORIGIN_RELATION = '珂赛特对应《悲惨世界》中冉阿让用一生守护的那束光——她是被拯救者，也是救赎得以完成的见证者。原著中，冉阿让在德纳第夫妇的旅店中发现八岁的珂赛特时，她正缩在桌底下干活，瘦弱、肮脏、沉默得像一件被遗忘的家具。他带走了她，从此她成了他全部的牵挂与软肋。而珂赛特对冉阿让的意义正在于此：她本身并不主动推动剧情，但她的存在定义了冉阿让每一次选择的终点——逃亡是为了她，活下来是为了她，最终放手也是为了她。\n「替罪之羊」对应《悲惨世界》中珂赛特作为“被牺牲者”与“被救赎者”的双重身份——她既是德纳第夫妇虐待的承受者，也是冉阿让救赎之路得以完成的代价。原著中，珂赛特被寄养在德纳第夫妇家中时，像一件被抵债的物品，承担着不属于她的罪责——她弱小、无助、无法反抗，却在那座旅店里承受了最多的苦役与冷漠。她并没有做错任何事，却成为了他人罪恶的承受者。';

        const SPOILER_LOCKED = true;
        const SPOILER_PASSWORD = '006618';
        const SPOILER_CONTENT = '某人的留言：这里什么都没有';
        
        /*
        
        /*
        ╔══════════════════════════════════════════╗
        ║  渲染逻辑                               ║
        ╚══════════════════════════════════════════╝
        */

        document.getElementById('charNameCN').textContent = CHAR_NAME_CN;
        document.getElementById('charNameEN').textContent = CHAR_NAME_EN;
        document.getElementById('charGender').textContent = CHAR_GENDER;
        document.getElementById('charHeight').textContent = CHAR_HEIGHT;
        document.getElementById('charPersonality').textContent = CHAR_PERSONALITY;
        document.getElementById('charJob').textContent = CHAR_JOB;
        document.getElementById('charLike').textContent = CHAR_LIKE;
        document.getElementById('charDislike').textContent = CHAR_DISLIKE;
        document.getElementById('charDescription').textContent = CHAR_DESCRIPTION;

        if (RELATED_CHARS.length === 0) {
            document.getElementById('relatedChars').innerHTML = '<span class="text-content">暂无</span>';
        } else {
            document.getElementById('relatedChars').innerHTML = RELATED_CHARS.map(c =>
                '<a href="' + c.url + '" class="related-char-card">' +
                '<div class="char-role">' + c.role + '</div>' +
                '<div class="char-name">' + c.name + '</div>' +
                '</a>'
            ).join('');
        }

        document.getElementById('originSource').textContent = ORIGIN_SOURCE;
        document.getElementById('originRelation').textContent = ORIGIN_RELATION;

        const spoilerSection = document.getElementById('spoilerSection');
        if (SPOILER_LOCKED) {
            spoilerSection.innerHTML = `
                <div class="spoiler-locked" id="spoilerLocked">
                    <div class="warning-text">⚠Warning⚠ 权限不足 无法访问 ⚠Warning⚠</div>
                    <div class="hint-text">请输入代码以获得权限</div>
                    <div class="spoiler-password">
                        <input type="password" id="spoilerInput" placeholder="密码">
                        <button onclick="unlockSpoiler()">确认</button>
                    </div>
                    <div class="spoiler-error" id="spoilerError">密码错误</div>
                </div>
                <div class="spoiler-content" id="spoilerContent">${SPOILER_CONTENT}</div>
            `;

            window.unlockSpoiler = function() {
                const input = document.getElementById('spoilerInput').value;
                if (input === SPOILER_PASSWORD) {
                    document.getElementById('spoilerLocked').style.display = 'none';
                    document.getElementById('spoilerContent').classList.add('unlocked');
                } else {
                    document.getElementById('spoilerError').style.display = 'block';
                }
            };
        } else {
            spoilerSection.innerHTML = '<div class="text-content">' + SPOILER_CONTENT + '</div>';
        }
    </script>

    <script>
        fetch('/loomcompanywiki/nav.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('nav-placeholder').innerHTML = html;
                const current = document.querySelector('[data-nav="employee"]');
                if (current) current.classList.add('active');
            });
    </script>

</body>
</html>
