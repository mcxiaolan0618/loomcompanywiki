她的才华被否定，心血被冷藏。面对这种无法跨越的现实壁垒，汉斯没有选择继续抗争，而是选择了彻底的逃避。

二、 梦境疗养院的真相
汉斯以“疗养”为名，主动申请接入M公司（建立在潜意识之河上的）梦境疗养院。
这里的规则极其残酷：病人在梦中时间停滞、日复一日；如果想离开，系统会剥离出病人的“理想自我”，让这个理想自我去外部世界代替病人生活，而真正的主人格则永远沉睡在梦境深处。

三、 萨尔温的诞生（心灵具象化）
汉斯在梦境中越陷越深，沉溺于时间停滞的安逸。但她潜意识深处，依然残留着对“清醒”的执念。
于是，她的潜意识在梦境中发生了一次罕见的心智奇点：那一小块“拒绝沉沦的清醒碎片”，结合了梦境之河的物质，被具象化成了一个独立的实体——萨尔温。

本质：萨尔温不是人类，她是汉斯心灵碎片与潜意识之河的具象化产物。

特征：她继承了汉斯全部的才华，甚至更加敏锐。她冷静、理智、精于计算。她身上带有一种“不属于这里”的疏离感（因为她本质上是时间病变中的一颗锚点）。

离开梦境：因为某种契机（或者疗养院系统的自动判定），萨尔温作为“理想自我”被系统送出了梦境，来到了外面的世界。但她没有汉斯的记忆，也不知道自己只是个替身。 她以为自己就是一个刚从疗养院康复的、名叫“萨尔温”的正常人，带着她的才华在外面生活。

四、 萨尔温的其他发明（心灵具象化应用）
正因为她是“心灵具象化”的产物，她在外面世界展现出的“发明”才能，往往带有强烈的意识与精神干涉属性：

「共情棱镜」（Empathy Prism）

设定：一个微型的水晶装置。可以捕捉周围人溢出的情绪波动（如恐惧、焦虑），并将其“具象化”为可视的光谱。

作用：在战斗中，这能让她精准察觉到敌人的精神破绽或队友的恐慌，从而做出最优的战术规划。

「记忆锚点」（Memory Anchors）

设定：结合了潜意识技术的注射剂或便携式仪器。

作用：能够强行稳固一个人濒临崩溃的理智。这不仅是物理上的治疗，更是利用“意向性”将对方的意识强行钉在当下（这也呼应了她的回理智被动）。

        if (SPOILER_LOCKED) {
            spoilerSection.innerHTML = `
                <div class="spoiler-locked" id="spoilerLocked">
                    <div class="warning-text">⚠Warning⚠ 权限不足 无法访问 ⚠Warning⚠</div>
                    <div class="hint-text">请输入代码以获得权限</div>
                    <div class="spoiler-password">

                        <button onclick="unlockSpoiler()">确认</button>
                    </div>
                    <div class="spoiler-error" id="spoilerError">密码错误</div>
                </div>
                <div class="spoiler-content" id="spoilerContent">${SPOILER_CONTENT}</div>
            `;

            window.unlockSpoiler = function() {
                const input = document.getElementById('spoilerInput').value;
                if (input === SPOILER_PASSWORD) {
                    document.getElementById('spoilerLocked').style.display = 'none';
                    document.getElementById('spoilerContent').classList.add('unlocked');
                } else {
                    document.getElementById('spoilerError').style.display = 'block';
                }
            };
        } else {
            spoilerSection.innerHTML = '<div class="text-content">' + SPOILER_CONTENT + '</div>';
