一、杰基尔博士与他的理论
杰基尔博士是T巢一位德高望重的医生、科学家与慈善家，为人正直、学识渊博、备受尊敬。但他内心深处始终有一个秘密的困扰——他认为“善”与“恶”并非天生，而是都市为了维护秩序定义出的标签，线内合法，线外犯罪。而他好奇的，恰好是线外的那一侧——不是为了满足欲望，而是为了验证自己对人性的理解，也为了看清自己埋藏多年的那份贪婪究竟能把他带到多远的地方。他活得体面、干净、安全，但那些已被验证的已知让他疲惫；线外的不可预测，反而值得一试。
后来他转职加入了六协会。在某次任务空窗期，他与两名同伴前往某公司倒塌后的废墟探索。一行人深入底层时遭遇了一只未记载的非人知性体，杰基尔拼死将其斩杀，自身也因重伤昏厥。然而他在探索过程中接触到了一把异想体镰刀——那东西在他失去意识时接管了他的身体。等他恢复知觉时，周围只剩下同伴的残骸与漫地的血迹，镰刀在他耳边低语：“是你杀的。”
他无法确认那是镰刀的操控，还是自己在濒死中被释放出的“另一个意志”。他只知道：事后回想时，那些“被同伴怂恿”的记忆正在褪色，取而代之的是一种不容否认的确定性——主动提议前往废墟的人，就是他自己。“人们总是会去美化一些事物，让自己可以接受。”他把那柄镰刀收了起来，给那个在自己体内嘶吼的东西取了一个名字。不是海德。是贪婪。

二、海德的诞生与肆意妄为
杰基尔第一次醒来时，最初感到的是空白——他什么都想不起来，只看见地上的血迹和同伴的残骸，以及手里那把不属于他的镰刀。他试图拼凑记忆，却只能想起一些碎片：怪物的嘶吼、自己挥剑的动作、然后就是一片黑暗。恐惧涌上来，比他预想中更冷、更真实——不是因为知道自己做了什么，而是因为他发现自己什么都想不起来。那种空白本身，比任何记忆都更可怕。
他回到六协会后继续接任务、继续在食堂和同事吃饭、继续把武器擦干净放好。没有人追问那天的事，因为所有人都以为他只是“在任务中失去了两名同伴”，而他自己也接受了这个说法——比接受“我不知道发生了什么”要容易得多。
他开始习惯那种白天扮演正常收尾人、深夜里反复擦拭镰刀的生活。镰刀起初只是沉默地躺在他手边，像一件无害的金属。但渐渐地，他开始听到一些模糊的低语，像是隔着水传来的声音，听不清内容，却让他没来由地感到一阵战栗。

三、杰基尔的挣扎与失控
杰基尔逐渐意识到，他无法完全控制那把镰刀了。
起初他只是偶尔在深夜听见低语，像是隔着一层水传来的声音，听不清内容，却让他没来由地感到一阵战栗。但随着时间的推移，那种低语开始在他清醒时也出现——任务途中、食堂里、甚至和同事说话时，镰刀的声音会突然插进来，像是另一个人在他脑子里开口说话。他没有告诉任何人，因为他无法确认那是镰刀的操控，还是自己濒死时被释放出的某个“另一个意志”。
他试图把镰刀处理掉——锁进柜子里、埋进废墟、甚至考虑过交给协会——但每一次，他都会在某个无法解释的冲动下把它重新取回来。后来他干脆放弃了，把它带在身上，像带着一块无法愈合的伤口。他越是想证明自己仍然可以靠“协会规则”和“任务流程”框住自己，那个声音就越清晰。更可怕的是，他开始发现自己有时会毫无征兆地站在某个不该在的地方——比如深夜的走廊尽头、任务目标的背后、或者自己根本不记得走过的街道上。他不确定那是镰刀在操控他的身体，还是他正在成为镰刀的一部分。
后来他去了H巢——因为T巢的每一寸地面都在提醒他那天的事。他换了一个名字，不再叫杰基尔博士，而是叫做墨严卿。他以为换一个地方、换一个身份，就可以让那些低语留在原来的巢里。
但他想错了。那把镰刀他一直带在身上，从T巢到H巢，从废墟到六协会，从未离手。他睡觉时放在枕边，出任务时挂在腰侧，吃饭时搁在手边——不是他舍不得，而是他试过放手，但每一次放手，镰刀都会在他看不见的地方重新出现。它不需要被“带”着，因为它早就和他长在一起了，像血管里流动的另一种液体，像某种自发生长的东西，在H巢的红色灯笼下、在六协会的食堂里、在他每一次擦剑的时候，低语着他还没有听清的那个名字。

四、药剂的失效与终局（还没有改）
杰基尔最终发现了一个比“失控”更致命的问题——药物开始失效了。

同样的配方、同样的剂量，第一次服用能让他顺利变回杰基尔。但下一次，同样的药剂却只能让他在海德的形态中停留更久，甚至完全无效。他开始四处采购化学原料，试图改良配方，但再也无法复制出最初那种“完美分离”的药效。

他意识到，他可能永远无法再变回纯粹的杰基尔了。

在最后的独白中，他写道：

“我这一生，曾经拥有两种人格。现在，那个属于杰基尔的部分已经越来越微弱……我在信纸上写下这些字时，我的手指正在变成海德的手指。”

他没能写完那封信。在他挚友厄特森与管家破门而入时，书房里只有海德的尸体——他已经选择服毒自尽，结束了这场善恶拉锯。

        document.getElementById('charLike').textContent = CHAR_LIKE;
        document.getElementById('charDislike').textContent = CHAR_DISLIKE;
        document.getElementById('charDescription').textContent = CHAR_DESCRIPTION;

        if (RELATED_CHARS.length === 0) {
            document.getElementById('relatedChars').innerHTML = '<span class="text-content">暂无</span>';
        } else {
            document.getElementById('relatedChars').innerHTML = RELATED_CHARS.map(c =>
                '<a href="' + c.url + '" class="related-char-card">' +
                '<div class="char-role">' + c.role + '</div>' +
                '<div class="char-name">' + c.name + '</div>' +
                '</a>'
            ).join('');
        }

        document.getElementById('originSource').textContent = ORIGIN_SOURCE;
        document.getElementById('originRelation').textContent = ORIGIN_RELATION;

        const spoilerSection = document.getElementById('spoilerSection');
        if (SPOILER_LOCKED) {
            spoilerSection.innerHTML = `
                <div class="spoiler-locked" id="spoilerLocked">
                    <div class="warning-text">⚠Warning⚠ 权限不足 无法访问 ⚠Warning⚠</div>
                    <div class="hint-text">输入密码：006618 即可访问</div>
                    <div class="spoiler-password">
                        <input type="password" id="spoilerInput" placeholder="密码">
                        <button onclick="unlockSpoiler()">确认</button>
                    </div>
                    <div class="spoiler-error" id="spoilerError">密码错误</div>
                </div>
                <div class="spoiler-content" id="spoilerContent">${SPOILER_CONTENT}</div>
            `;

            window.unlockSpoiler = function() {
                const input = document.getElementById('spoilerInput').value;
                if (input === SPOILER_PASSWORD) {
                    document.getElementById('spoilerLocked').style.display = 'none';
                    document.getElementById('spoilerContent').classList.add('unlocked');
                } else {
                    document.getElementById('spoilerError').style.display = 'block';
                }
            };
        } else {
            spoilerSection.innerHTML = '<div class="text-content">' + SPOILER_CONTENT + '</div>';
        }
    </script>

    <script>
        fetch('/loomcompanywiki/nav.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('nav-placeholder').innerHTML = html;
                const current = document.querySelector('[data-nav="employee"]');
                if (current) current.classList.add('active');
            });
    </script>

</body>
